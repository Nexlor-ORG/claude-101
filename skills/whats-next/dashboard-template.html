<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" data-own>
<meta name="viewport" content="width=device-width, initial-scale=1" data-own>
<title data-own>What's next</title>
<style data-own>
/* Central Inbox's system (a framed surface, tiles lit from the top edge, pill buttons) on Nexlor's
   colours. Light is the default; dark follows the device or the switch. The founder's brand colour
   is the accent: --accent-light on light, --accent-dark on dark. */
:root {
  --accent-light: #B23A16; --accent-dark: #FF9A7A; --accent: var(--accent-light);
  --surface: #FFFFFF; --text: #17132E; --dim: rgba(23,19,46,.68); --hair: rgba(23,19,46,.09); --ink: #FFFFFF;
  --night: #EFEBF7; --g1: #D8C9F6; --g2: #F6D2E3; --halo: rgba(123,47,247,.10);
  --wash: color-mix(in srgb, var(--accent) 12%, transparent); --ring: color-mix(in srgb, var(--accent) 38%, transparent);
  --tile: rgba(23,19,46,.025); --tile-edge: inset 0 0 0 1px rgba(23,19,46,.07); --tile-lead-edge: inset 0 0 0 1px var(--ring);
  --quiet: rgba(23,19,46,.06); --quiet-edge: inset 0 0 0 1px rgba(23,19,46,.06); --quiet-hover: rgba(23,19,46,.11);
  --btn-hover: #2E2858; --chip: rgba(23,19,46,.07); --current: rgba(23,19,46,.06); --track: rgba(23,19,46,.08);
  --good: #1E6B45; --good-bg: rgba(30,107,69,.10); --watch: #8A5300; --watch-bg: rgba(214,138,36,.16); --act: #A3261E; --act-bg: rgba(163,38,30,.09);
  --act-tile: radial-gradient(90% 80% at 100% 0%, rgba(163,38,30,.07), transparent 70%), #FFFFFF; --act-edge: inset 0 0 0 1px rgba(163,38,30,.22);
  --underline: rgba(23,19,46,.35); --ease-out: cubic-bezier(.23, 1, .32, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: var(--accent-dark);
    --surface: #0D0B16; --text: #FCF7FD; --dim: rgba(252,247,253,.68); --hair: rgba(252,247,253,.08); --ink: #150A33;
    --night: #0B0918; --g1: #3B1A78; --g2: #6A1C4C; --halo: rgba(110,48,193,.40);
    --wash: color-mix(in srgb, var(--accent) 30%, transparent); --ring: color-mix(in srgb, var(--accent) 42%, transparent);
    --tile: rgba(252,247,253,.04); --tile-edge: inset 0 1px 0 rgba(252,247,253,.11), inset 0 0 0 1px rgba(252,247,253,.045);
    --tile-lead-edge: inset 0 1px 0 rgba(252,247,253,.16), inset 0 0 0 1px var(--ring);
    --quiet: rgba(252,247,253,.09); --quiet-edge: inset 0 1px 0 rgba(252,247,253,.14); --quiet-hover: rgba(252,247,253,.16);
    --btn-hover: #FFFFFF; --chip: rgba(252,247,253,.07); --current: rgba(252,247,253,.10); --track: rgba(252,247,253,.08);
    --good: #8EE0B2; --good-bg: rgba(142,224,178,.12); --watch: #FFB57A; --watch-bg: rgba(255,181,122,.13); --act: #FF9A8F; --act-bg: rgba(255,154,143,.14);
    --act-tile: radial-gradient(90% 80% at 100% 0%, rgba(255,154,143,.14), transparent 70%), rgba(252,247,253,.04);
    --act-edge: inset 0 1px 0 rgba(255,154,143,.35), inset 0 0 0 1px rgba(255,154,143,.22);
    --underline: rgba(252,247,253,.35);
  }
}
:root[data-theme="dark"] {
  --accent: var(--accent-dark);
  --surface: #0D0B16; --text: #FCF7FD; --dim: rgba(252,247,253,.68); --hair: rgba(252,247,253,.08); --ink: #150A33;
  --night: #0B0918; --g1: #3B1A78; --g2: #6A1C4C; --halo: rgba(110,48,193,.40);
  --wash: color-mix(in srgb, var(--accent) 30%, transparent); --ring: color-mix(in srgb, var(--accent) 42%, transparent);
  --tile: rgba(252,247,253,.04); --tile-edge: inset 0 1px 0 rgba(252,247,253,.11), inset 0 0 0 1px rgba(252,247,253,.045);
  --tile-lead-edge: inset 0 1px 0 rgba(252,247,253,.16), inset 0 0 0 1px var(--ring);
  --quiet: rgba(252,247,253,.09); --quiet-edge: inset 0 1px 0 rgba(252,247,253,.14); --quiet-hover: rgba(252,247,253,.16);
  --btn-hover: #FFFFFF; --chip: rgba(252,247,253,.07); --current: rgba(252,247,253,.10); --track: rgba(252,247,253,.08);
  --good: #8EE0B2; --good-bg: rgba(142,224,178,.12); --watch: #FFB57A; --watch-bg: rgba(255,181,122,.13); --act: #FF9A8F; --act-bg: rgba(255,154,143,.14);
  --act-tile: radial-gradient(90% 80% at 100% 0%, rgba(255,154,143,.14), transparent 70%), rgba(252,247,253,.04);
  --act-edge: inset 0 1px 0 rgba(255,154,143,.35), inset 0 0 0 1px rgba(255,154,143,.22);
  --underline: rgba(252,247,253,.35);
}
* { box-sizing: border-box; }
body { margin: 0; padding: 12px; min-height: 100vh; color: var(--text); background-color: var(--night);
  background: radial-gradient(55% 60% at 8% 100%, var(--g1) 0%, transparent 62%), radial-gradient(50% 55% at 95% 0%, var(--g2) 0%, transparent 60%), var(--night);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; font-optical-sizing: auto; font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
:where(h1, h2, h3, p, ul, ol) { margin: 0; }
:where(ul, ol) { padding: 0; list-style: none; }
:where(button) { font: inherit; color: inherit; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.frame { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding: 12px 26px 16px; border-radius: 28px;
  background: var(--surface); box-shadow: 0 0 0 1px var(--ring), 0 0 90px var(--halo); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 36px; }
.brand { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.right { display: flex; align-items: center; gap: 14px; color: var(--dim); font-size: 13px; }
.seg { display: flex; gap: 2px; padding: 4px; border-radius: 99px; background: var(--quiet); box-shadow: var(--quiet-edge); }
.seg button { min-height: 30px; padding: 0 13px; border-radius: 99px; color: var(--dim); font-size: 12.5px; transition: background-color 160ms ease, color 160ms ease; }
.seg button[aria-pressed="true"] { background: var(--current); color: var(--text); box-shadow: var(--quiet-edge); }
.live { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }
.live.old i { background: var(--watch); box-shadow: 0 0 0 3px var(--watch-bg); }

.hero { display: flex; align-items: end; justify-content: space-between; gap: 30px; padding: 10px 2px 4px; }
.hero h1 { font-size: clamp(32px, 3.6vw, 52px); font-weight: 400; letter-spacing: -.04em; line-height: 1.02; text-wrap: balance; }
.hero .n { display: inline-grid; place-items: center; min-width: 1.5em; height: 1.12em; padding: 0 .3em; margin-right: .22em; border-radius: .34em; vertical-align: -.12em;
  box-shadow: inset 0 0 0 1.5px var(--accent); background: linear-gradient(160deg, var(--wash), transparent); font-size: .82em; }
.hero p { color: var(--dim); text-align: right; max-width: 44ch; }
.notices { display: grid; gap: 6px; font-size: 13px; }
.notices li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 7px 8px 7px 16px; border-radius: 99px;
  color: var(--watch); background: var(--watch-bg); }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.tile { min-width: 0; border-radius: 20px; padding: 16px 18px; background: var(--tile); box-shadow: var(--tile-edge); }
.label { font-size: 12.5px; font-weight: 500; letter-spacing: .01em; color: var(--dim); display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
.tag { display: inline-block; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 99px; background: var(--wash); color: var(--accent); white-space: nowrap; }
.goaltag { background: var(--chip); color: var(--text); white-space: normal; }
.goaltag::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--accent); vertical-align: 1px; }
.dim { color: var(--dim); }

/* Goals: full width, side by side when there are two */
.goals { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); column-gap: 40px; row-gap: 16px; align-items: start; padding: 18px 22px; }
.goal { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.goal + .goal { padding-left: 40px; box-shadow: inset 1px 0 0 var(--hair); }
.goal .label { margin-bottom: 0; }
.goal h2 { font-size: 17px; font-weight: 500; letter-spacing: -.01em; line-height: 1.25; overflow-wrap: anywhere; }
.goal .count { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
.goal .big { font-size: 44px; font-weight: 400; letter-spacing: -.04em; line-height: 1; }
.goal.second .big { font-size: 36px; }
.goal .of { color: var(--dim); }
.goal .one { margin-top: 4px; padding-top: 10px; box-shadow: inset 0 1px 0 var(--hair); font-size: 13.5px; }
.bar { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }

/* This quarter: one strip */
.quarter { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 14px 12px 22px; }
.quarter.overdue { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--watch) 45%, transparent); }
.quarter .qlabel { font-size: 12.5px; font-weight: 500; color: var(--dim); }
.quarter h2 { flex: 1; min-width: 240px; font-size: 15px; font-weight: 500; letter-spacing: -.01em; overflow-wrap: anywhere; }
.quarter .qrev { font-size: 12.5px; color: var(--dim); }
.quarter.overdue .qrev { color: var(--watch); font-weight: 600; }
.quarter .prompt-box { flex-basis: 100%; }

.block { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px; }
.rows { display: flex; flex-direction: column; gap: 10px; }
.row-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 16px; align-items: start; padding: 14px 18px; }
.row-item.first { background: radial-gradient(90% 140% at 0% 0%, var(--wash), transparent 70%), var(--tile); box-shadow: var(--tile-lead-edge); }
.row-item .num { width: 30px; height: 30px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); font-size: 12px; font-weight: 600; }
.row-item.first .num { box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--wash); }
.row-item .t, .att .t, .idea .t { font-size: 16px; font-weight: 500; letter-spacing: -.01em; line-height: 1.3; overflow-wrap: anywhere; }
.row-item .f, .att .note, .idea .note { font-size: 13px; color: var(--dim); overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 6px; }
.owner-name { font-size: 12.5px; color: var(--dim); }
.owner-name::before { content: "· "; }
.side-acts { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.links { display: flex; gap: 14px; }
.textbtn { min-height: 28px; font-size: 12.5px; color: var(--dim); transition: color 160ms ease; }
.busy-line { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; flex: none; }
.btn .dot { width: 7px; height: 7px; margin-right: 8px; background: currentColor; }
@keyframes pulse { 50% { opacity: .25; } }
.more { align-self: flex-start; padding-left: 4px; }
.checked { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 2px 4px; font-size: 12.5px; color: var(--dim); }
.checked-head { font-weight: 500; color: var(--text); }
.checked ul { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.checked li { position: relative; padding-left: 16px; }
.checked li::before { content: ""; position: absolute; left: 1px; top: 5px; width: 8px; height: 4px; border: solid var(--good); border-width: 0 0 1.5px 1.5px; transform: rotate(-45deg); }

/* The prompt being copied, shown */
.prompt-box { grid-column: 2 / -1; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; padding: 10px 14px 12px; border-radius: 14px; background: var(--quiet); box-shadow: var(--quiet-edge);
  transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
@starting-style { .prompt-box { opacity: 0; transform: translateY(-4px); } }
.prompt-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12.5px; color: var(--dim); }
.prompt-text { font-size: 13.5px; line-height: 1.55; max-width: 76ch; white-space: pre-line; overflow-wrap: anywhere; }

/* Drafts, inside the item */
.inline-drafts { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 12px; margin-top: 6px; padding-top: 14px; box-shadow: inset 0 1px 0 var(--hair);
  transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out); }
@starting-style { .inline-drafts { opacity: 0; transform: translateY(-4px); } }
.drafts-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.drafts-head .note { font-size: 13px; color: var(--dim); }
.draft-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.draft-grid.one { grid-template-columns: minmax(0, 680px); }
.draft { display: flex; flex-direction: column; padding: 6px 20px 16px; border-radius: 16px; background: var(--surface); box-shadow: var(--tile-edge);
  transition: opacity 240ms var(--ease-out), transform 240ms var(--ease-out); }
@starting-style { .draft { opacity: 0; transform: translateY(6px); } }
.draft:nth-child(2) { transition-delay: 40ms; } .draft:nth-child(3) { transition-delay: 80ms; }
.field { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; padding: 9px 0; font-size: 13px; box-shadow: inset 0 -1px 0 var(--hair); overflow-wrap: anywhere; }
.field .k { color: var(--dim); }
.field .subj { font-size: 13.5px; font-weight: 600; }
.draft .body { flex: 1; padding-top: 12px; font-size: 14px; line-height: 1.6; white-space: pre-line; max-width: 64ch; overflow-wrap: anywhere; }
.draft .acts { margin-top: 8px; }
.safe { font-size: 12.5px; color: var(--dim); }
.btn.saved { color: var(--good); }

.att-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.att, .idea { display: flex; flex-direction: column; gap: 6px; }
.att .label { margin-bottom: 0; }
.att.act { background: var(--act-tile); box-shadow: var(--act-edge); }
.att .prompt-box, .idea .prompt-box { margin-top: 8px; }
.ideas-empty { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.ideas-empty p { color: var(--dim); }
.acts { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.att .acts, .idea .acts { margin-top: 4px; }
.btn { display: inline-flex; align-items: center; min-height: 40px; padding: 0 20px; border-radius: 99px; font-weight: 600; font-size: 13.5px; text-decoration: none;
  background: var(--text); color: var(--ink); white-space: nowrap; transition: transform 160ms var(--ease-out), background-color 160ms ease; }
.btn.quiet { background: var(--quiet); color: var(--text); box-shadow: var(--quiet-edge); }
.btn.sm { min-height: 34px; padding: 0 14px; font-size: 12.5px; }
.btn:active { transform: scale(.97); }
.btn[aria-busy="true"] { pointer-events: none; }
.zero { display: grid; place-content: center; text-align: center; gap: 8px; min-height: 180px; }
.zero h2 { font-size: clamp(26px, 3vw, 36px); font-weight: 400; letter-spacing: -.04em; }
.zero p { color: var(--dim); }
.seeall { grid-column: 1 / -1; display: flex; justify-content: center; }

/* Weekly review, on the page */
.review { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 16px; padding: 18px 22px 20px; box-shadow: var(--tile-lead-edge);
  background: radial-gradient(70% 120% at 100% 0%, var(--wash), transparent 70%), var(--tile);
  transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out); }
@starting-style { .review { opacity: 0; transform: translateY(-4px); } }
.review-head { display: flex; justify-content: space-between; align-items: center; }
.rv-title { font-size: 12.5px; font-weight: 500; color: var(--dim); margin-bottom: 6px; }
.rv-list li { position: relative; padding: 3px 0 3px 16px; font-size: 14px; }
.rv-list li::before { content: ""; position: absolute; left: 2px; top: 11px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.rv-done { display: flex; flex-direction: column; gap: 4px; }
.rv-done li { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; font-size: 13.5px; }
.rv-q { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; box-shadow: inset 0 1px 0 var(--hair); }
.rv-count { font-size: 12.5px; color: var(--dim); }
.rv-ask { font-size: 19px; font-weight: 500; letter-spacing: -.02em; line-height: 1.25; max-width: 60ch; }
.rv-options { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 16px; border-radius: 99px; font-size: 13.5px; font-weight: 500; background: var(--surface); box-shadow: inset 0 0 0 1px var(--ring);
  transition: background-color 160ms ease, transform 160ms var(--ease-out); }
.chip:active { transform: scale(.97); }
.rv-own { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.rv-own input { flex: 1; min-width: 220px; min-height: 40px; padding: 0 14px; border-radius: 12px; border: 0; font: inherit; color: var(--text); background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair); }
.rv-plan { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 32px; }
.rv-objective { font-size: 17px; font-weight: 500; letter-spacing: -.01em; line-height: 1.3; }

.section-head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 2px 0; font-size: 12.5px; color: var(--dim); }
.block > .section-head { padding-top: 6px; }
.section-head h2 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: var(--text); }
.metrics { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.metric { display: flex; flex-direction: column; gap: 6px; }
.metric .label { margin-bottom: 2px; }
.metric .big { font-size: 30px; font-weight: 400; letter-spacing: -.04em; line-height: 1.05; }
.metric .note { font-size: 12.5px; color: var(--dim); line-height: 1.45; }
.metric.missing { background: none; box-shadow: none; border: 1px dashed var(--underline); }
.metric.missing .big { color: var(--dim); }
.tone { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.good { color: var(--good); } .watch { color: var(--watch); } .act { color: var(--act); }
.tone.good { background: var(--good-bg); } .tone.watch { background: var(--watch-bg); } .tone.act { background: var(--act-bg); }
.quietlink { align-self: flex-start; min-height: 32px; color: var(--dim); font-size: 12.5px; text-decoration: underline dotted var(--underline); text-underline-offset: 3px; transition: color 160ms ease; }
.how { padding-top: 8px; box-shadow: inset 0 1px 0 var(--hair); font-size: 12.5px; line-height: 1.5; color: var(--dim); transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
@starting-style { .how { opacity: 0; transform: translateY(-4px); } }
.connect { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 20px 22px;
  background: radial-gradient(90% 90% at 0% 0%, var(--wash), transparent 70%), var(--tile); }
.connect h3 { font-size: 20px; font-weight: 500; letter-spacing: -.02em; }
.connect p { color: var(--dim); max-width: 62ch; margin-bottom: 6px; }
.strip { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; padding: 12px 4px 0; box-shadow: inset 0 1px 0 var(--hair); font-size: 12.5px; color: var(--dim); }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; z-index: 5; max-width: calc(100vw - 32px);
  padding: 10px 18px; border-radius: 99px; background: var(--text); color: var(--ink); font-weight: 600; font-size: 13.5px;
  transition: opacity 200ms ease, transform 200ms var(--ease-out); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (hover: hover) and (pointer: fine) {
  .btn:hover { background: var(--btn-hover); }
  .btn.quiet:hover { background: var(--quiet-hover); }
  .quietlink:hover, .seg button:hover, .textbtn:hover { color: var(--text); }
  .chip:hover { background: var(--wash); }
}
@media (max-width: 860px) {
  body { padding: 8px; }
  .frame { padding: 10px 16px 16px; border-radius: 24px; }
  .top { flex-wrap: wrap; }
  .hero { flex-direction: column; align-items: flex-start; gap: 10px; }
  .hero p { text-align: left; }
  .goals { grid-template-columns: minmax(0, 1fr); }
  .goal + .goal { padding-left: 0; padding-top: 14px; box-shadow: inset 0 1px 0 var(--hair); }
  .quarter { padding: 14px 18px; }
  .quarter h2 { min-width: 100%; }
  .row-item { grid-template-columns: auto minmax(0, 1fr); }
  .side-acts { grid-column: 1 / -1; align-items: flex-start; }
  .prompt-box { grid-column: 1 / -1; }
  .prompt-head, .drafts-head { flex-direction: column; align-items: flex-start; gap: 4px; }

<script data-own>
/* The page as it arrived, kept so a saved weekly review can publish the same page with new SETUP.
   Only the page's own elements (data-own) are kept; anything a viewer adds is left out. */
const PRISTINE = { head: document.head.cloneNode(true), body: document.body.cloneNode(true) };
const SETUP = JSON.parse(document.getElementById("setup").textContent);
// Setups saved before version 4 had one `goal`.
if (!SETUP.goals) SETUP.goals = SETUP.goal ? [SETUP.goal] : [];

/* ============================================================================================
   2. PLAYS — what the dashboard knows how to notice. Claude keeps the plays for the tools this
      founder has connected, removes the rest, and adds plays it wrote and proved during setup
      (see plays.md). Each play reads through `read(server, tool, input)` and returns one item,
      or null when there is nothing to do; `clear` says what was checked when it finds nothing.
   ============================================================================================ */
const DAY = 864e5;
const gmailDate = (d) => `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
const localTime = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 19);
const isoDay = (d) => localTime(d).slice(0, 10);
const clean = (s) => String(s || "").replace(/[\r\n<>]/g, " ").trim().slice(0, 60);
const listNames = (names) => names.length <= 2 ? names.join(" and ") : `${names[0]}, ${names[1]} and ${names.length - 2} more`;
const robot = /no-?reply|notification|mailer|newsletter|donotreply|support@|billing@|info@/i;
// The first list called `key` anywhere in a connector's answer, however deep: connectors nest
// their lists differently (Zoho Books puts invoices a level deeper than Xero).
function findList(obj, key) {
  const queue = [obj];
  for (let n = 0; queue.length && n < 500; n++) {
    const o = queue.shift();
    if (!o || typeof o !== "object") continue;
    if (Array.isArray(o[key])) return o[key];
    for (const v of Object.values(o)) if (v && typeof v === "object") queue.push(v);
  }
  return [];
}
// Gmail gives `sender` as an address and the display names in a separate list.
const gmailName = (msg, address) => {
  const hit = (msg.addressDisplayNames || []).find((a) => a.emailAddress === address);
  return clean((hit && hit.displayName) || String(address || "").split("@")[0]);
};
// The founder's own email domain, from their own entry on an event (the calendar's name is not
// always an address).
const ownDomain = (events, summary) => {
  for (const e of events) { const me = (e.attendees || []).find((a) => a.self && a.email); if (me) return me.email.split("@")[1]; }
  return String(summary || "").split("@")[1] || "";
};
// People on an event who are not the founder, not in the founder's domain, and have not declined.
const outsiders = (event, own) => (event.attendees || [])
  .filter((a) => a.email && !a.self && !a.resource && a.responseStatus !== "declined" && !(own && a.email.endsWith("@" + own)));
// A sales meeting: one or two outside people, not a repeating meeting. Bigger groups are delivery.
const salesMeeting = (e, own) => { const n = outsiders(e, own).length; return e.status !== "cancelled" && !e.recurringEventId && n >= 1 && n <= 2; };
const sentAt = (m) => Number(m.internalDate) || Date.parse(m.date) || NaN;
const attendeeName = (a) => clean(a.displayName || a.email.split("@")[0]);
const me = () => SETUP.founder || "me";

const PLAYS = [
  {
    id: "gmail-waiting-on-you",
    what: "People who emailed in the last two weeks and have waited more than two days for a reply.",
    helps: ["keep-customers", "win-customers"],
    tools: [["Gmail", "search_threads"]],
    clear: "Gmail, Primary inbox, last 14 days: no one is waiting on a reply from you",
    async find(read, ctx) {
      const r = await read("Gmail", "search_threads",
        { query: "in:inbox category:primary newer_than:14d older_than:2d -from:me", pageSize: 30, view: "THREAD_VIEW_MINIMAL" });
      const waiting = (r.threads || []).map((t) => (t.messages || []).at(-1))
        .filter((m) => m && !(m.labelIds || []).includes("SENT") && !robot.test(m.sender));
      if (!waiting.length) return null;
      const names = [...new Set(waiting.map((m) => gmailName(m, m.sender)))];
      const oldest = Math.min(...waiting.map(sentAt));
      return {
        line: `Reply to ${listNames(names)}`,
        fact: waiting.length === 1 ? "1 email has waited more than two days" : `${waiting.length} emails have waited more than two days`,
        urgent: Number.isFinite(oldest) && ctx.now - oldest > 4 * DAY,
        doHere: true, doButton: waiting.length === 1 ? "Draft the reply here" : "Draft the replies here",
        prompt: `Task: Reply to the emails in my Primary inbox from ${listNames(names)}. They have waited more than two days.\n\nFind: each email thread in Gmail.\n\nWrite: one short reply to each that answers what they asked. Warm and clear, signed ${me()}.`
      };
    }
  },
  {
    id: "calendar-prepare",
    what: "Meetings in the next two days with one or two people from outside the business, not repeating ones.",
    helps: ["win-customers", "keep-customers", "deliver-work"],
    tools: [["Google Calendar", "list_events"]],
    clear: "Calendar, next two days: no meetings with outside people to prepare for",
    async find(read, ctx) {
      const r = await read("Google Calendar", "list_events", {
        startTime: localTime(ctx.now), endTime: localTime(new Date(ctx.now.getTime() + 2 * DAY)), orderBy: "startTime", pageSize: 25 });
      const events = r.events || [], own = ownDomain(events, r.summary);
      const meetings = events.filter((e) => e.start && e.start.dateTime && salesMeeting(e, own));
      if (!meetings.length) return null;
      const first = meetings[0], start = new Date(first.start.dateTime);
      const when = start.toLocaleString(undefined, { weekday: "long", hour: "numeric", minute: "2-digit" });
      const who = listNames(outsiders(first, own).map(attendeeName));
      return {
        line: `Prepare for ${clean(first.summary) || "your meeting"}`,
        fact: `${when}, with ${who}.` + (meetings.length > 1 ? ` ${meetings.length - 1} more like this in the next two days.` : ""),
        urgent: start - ctx.now < DAY, due: isoDay(start), kind: "brief",
        doHere: true, doButton: "Prepare a brief here",
        prompt: `Task: Prepare me for "${clean(first.summary)}" on ${when} with ${who}.\n\nFind: the calendar entry and every email with them this year.\n\nGive me: a one-page brief in bullet points: who is coming and their roles, what we've discussed, anything they've asked that I haven't answered, and three questions I should ask.`
      };
    }
  },
  {
    id: "calendar-follow-up",
    what: "Meetings in the past week with one or two people from outside the business, not repeating ones, with no email to them since.",
    helps: ["win-customers", "keep-customers"],
    tools: [["Google Calendar", "list_events"], ["Gmail", "search_threads"]],
    clear: "Calendar, last 7 days: every meeting with outside people has had a follow-up",
    async find(read, ctx) {
      const r = await read("Google Calendar", "list_events", {
        startTime: localTime(new Date(ctx.now.getTime() - 7 * DAY)), endTime: localTime(ctx.now), orderBy: "startTimeDesc", pageSize: 25 });
      const events = r.events || [], own = ownDomain(events, r.summary);
      const held = events.filter((e) => e.end && e.end.dateTime && salesMeeting(e, own)).slice(0, 5);
      const open = [];
      for (const e of held) {
        const guest = outsiders(e, own)[0];
        // Gmail's `after:` counts from midnight, so an email sent earlier on the meeting day counts as a follow-up.
        const sent = await read("Gmail", "search_threads", { query: `in:sent to:${guest.email} after:${gmailDate(new Date(e.end.dateTime))}`, pageSize: 1, view: "THREAD_VIEW_MINIMAL" });
        if (!(sent.threads || []).length) open.push({ e, guest });
      }
      if (!open.length) return null;
      const { e, guest } = open[0];
      const day = new Date(e.end.dateTime).toLocaleString(undefined, { weekday: "long" });
      return {
        line: `Follow up ${day}'s meeting with ${attendeeName(guest)}`,
        fact: `No email to them since "${clean(e.summary)}".` + (open.length > 1 ? ` ${open.length - 1} more like this.` : ""),
        urgent: false, doHere: true, doButton: "Draft it here",
        prompt: `Task: Follow up "${clean(e.summary)}" on ${day} with ${attendeeName(guest)}. I haven't emailed them since.\n\nFind: the calendar entry and my earlier emails with them, for what we discussed and agreed.\n\nWrite: a short thank-you with the next step we agreed. Under 90 words, signed ${me()}.`
      };
    }
  }
];

/* ============================================================================================
   3. MEASURES — the numbers under Business health and Growth, and the goals' progress. Claude
      writes and proves these during setup from the founder's own accounting and shop data
      (see measures.md). Each reads through `read(server, tool, input)` and returns one number,
      or null when the data is not there. A measure with group "goal" (and `goal`, its index in
      SETUP.goals) updates that goal instead.
   ============================================================================================ */
const MEASURES = [];

/* ============================================================================================
   4. THE PAGE — do not change below this line when filling in a founder's dashboard.
   ============================================================================================ */
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const btn = (text, cls, onclick) => { const b = el("button", cls, text); b.type = "button"; if (onclick) b.onclick = onclick; return b; };
const WORDS = { good: "Healthy", watch: "Watch", act: "Act now" };
const END_DRAFTS = "Don't ask me questions first. Use my connected tools for anything you need, make sensible assumptions, and list them under the drafts so I can check them. Show me the drafts, and save them to my Gmail drafts only when I say yes. Never send anything.";
const END_NO_GMAIL = "Don't ask me questions first. Use my connected tools for anything you need, make sensible assumptions, and list them under the drafts so I can check them. Show me the drafts. Never send anything.";
const END_BRIEF = "Don't ask me questions first. Use my connected tools for anything you need, and list any assumptions at the end.";

// ponytail: "done", "not for me" and the theme are remembered per browser (localStorage).
// Move them into SETUP once founders use more than one device.
const store = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
};
const MEMORY_KEY = "whats-next-memory-v1", THEME_KEY = "whats-next-theme";
const memory = {
  read() { return store.get(MEMORY_KEY, {}); },
  mark(id, kind) { const m = this.read(); m[id] = { kind, at: Date.now() }; store.set(MEMORY_KEY, m); }
};
const fresh = (mem, id, now) => { const m = mem[id]; return !m || (m.kind === "done" && now - m.at >= 7 * DAY); };

// The Eisenhower rule. Important = the item helps something in the founder's focus.
// Urgent and important first, then important; equals are ordered by due date, then by play.
// Urgent but not important is offered to Claude. Neither is never shown. The rest of the
// important items wait behind "more", never silently cut.
function choose(items, focus, mem, now) {
  const open = items.filter((i) => fresh(mem, i.id, now))
    .map((i, n) => ({ ...i, n, important: (i.helps || []).some((h) => focus.includes(h)), again: !!mem[i.id] }));
  const due = (i) => (i.due ? Date.parse(i.due) : Infinity);
  const ranked = open.filter((i) => i.important)
    .sort((a, b) => (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0) || due(a) - due(b) || a.n - b.n);
  return { next: ranked.slice(0, 3), more: ranked.slice(3), hand: open.filter((i) => !i.important && i.urgent).slice(0, 3) };
}

const money = (n, cur) => (n < 0 ? "−" : "") + (cur || "R") + Math.round(Math.abs(n)).toLocaleString("en-GB");
const goalNumber = (g, n) => g.money ? money(n, g.currency) : Math.round(n).toLocaleString("en-GB");
const monthName = (d, today) => d.toLocaleDateString(undefined, d.getFullYear() === today.getFullYear() || d - today < 300 * DAY ? { month: "long" } : { month: "long", year: "numeric" });
const shortDate = (d) => d.toLocaleDateString(undefined, { day: "numeric", month: "short" });

// One goal's progress, pace and status. A goal is counted by a tool (a goal measure), by the
// founder at each weekly review (countedBy "founder", when no connector can count it), or not
// yet (needsAnswer: Claude needs one answer to count it).
function goalView(g, today, index, count) {
  if (!g || !g.title) return null;
  const view = { label: count > 1 ? `Goal ${index + 1}` : "Your goal", title: g.title, tracked: false };
  if (g.needsAnswer) {
    return { ...view, needs: true, now: g.needsAnswer.found || "", of: g.needsAnswer.of || "", tone: "watch", status: "Needs one answer",
      pace: g.needsAnswer.why || "Claude needs one answer before it can count this. It asks at your weekly review." };
  }
  const tracked = g.now != null && g.target != null && g.by;
  if (!tracked) {
    view.pace = g.countedBy === "founder" ? "Claude asks you for this number at your weekly review."
      : g.source ? `Tracked for you once ${g.source} is connected.` : "Ask Claude how this goal can be counted.";
    return view;
  }
  view.tracked = true;
  const end = new Date(g.by), months = Math.max(0.25, (end - today) / (30.44 * DAY)), left = g.target - g.now;
  view.now = goalNumber(g, g.now);
  view.of = "of " + goalNumber(g, g.target) + (g.unit ? " " + g.unit : "");
  view.fill = Math.max(2, Math.min(100, Math.round(g.now / g.target * 100))) + "%";
  view.short = goalNumber(g, g.target) + (g.unit ? " " + g.unit : "");
  if (left <= 0) { view.tone = "good"; view.status = "Reached"; view.pace = "You have reached this goal. Ask Claude to set the next one."; return view; }
  const needed = left / months, when = monthName(end, today);
  if (g.money) view.pace = `You need to grow by about ${money(needed, g.currency)} a month to reach it by ${when}.`;
  else {
    const weeks = months * 4.345 / left;
    view.pace = weeks >= 1.5 ? `You need ${goalNumber(g, left)} more by ${when}: about one every ${Math.round(weeks)} weeks.`
                             : `You need ${goalNumber(g, left)} more by ${when}: about ${Math.round(left / (months * 4.345))} a week.`;
  }
  if (g.countedBy === "founder") {
    const asked = g.askedAt ? new Date(g.askedAt) : null;
    view.pace = `${g.source ? g.source + " has no Claude connector, so " : ""}Claude asks you for this number at each weekly review.`
      + (asked && !isNaN(asked) ? ` Last answer ${shortDate(asked)}.` : "");
  }
  if (g.ratePerMonth != null) {
    const onPace = g.ratePerMonth >= needed * 0.95;
    view.tone = onPace ? "good" : "watch";
    view.status = onPace ? "On pace" : "Behind pace";
    const reach = g.now + g.ratePerMonth * months;
    if (!onPace && g.countedBy !== "founder") view.pace += ` At your current pace you will reach ${goalNumber(g, g.money ? reach : Math.floor(reach))} by ${when}.`;
  }
  if (g.startsOn && new Date(g.startsOn) > today) { view.tone = "watch"; view.status = "Starts " + shortDate(new Date(g.startsOn)); }
  if (g.stale) { view.tone = "watch"; view.status = "From " + g.stale; }
  if (g.perCustomer) view.one = `One more ${SETUP.customerWord || "customer"} takes you to ${goalNumber(g, g.now + g.perCustomer)}`
    + (g.money ? (g.unit ? " " + g.unit : "") : " of " + goalNumber(g, g.target)) + ".";
  return view;
}

// Which goal an item moves, as a short tag. Plays may set `goal` themselves.
function goalTag(item, goals) {
  if (item.goal) return item.goal;
  const views = goals.map((g, i) => ({ g, short: (g.money ? goalNumber(g, g.target || 0) : (g.target != null ? goalNumber(g, g.target) : "")) + (g.unit ? " " + g.unit : ""), i }));
  if (views.length === 1) return views[0].short.trim() ? "Toward " + views[0].short : "Toward your goal";
  const hit = views.find((v) => (v.g.helps || []).some((h) => (item.helps || []).includes(h)));
  if (hit) return `Goal ${hit.i + 1}: ${hit.short}`.trim();
  return (item.helps || []).includes("get-paid") ? "Cash for your goals" : "Toward your goals";
}

// The quarter's objective and how long ago the founder reviewed it. Past a week, it asks for
// the weekly review.
function planView(plan, today) {
  if (!plan || !plan.objective) return { objective: "Your plan for the next three months", reviewed: "Not set yet", overdue: true };
  const d = new Date(plan.reviewedAt), days = isNaN(d) ? 99 : Math.floor((today - d) / DAY);
  const reviewed = days <= 0 ? "Reviewed today" : days === 1 ? "Reviewed yesterday"
    : days < 7 ? "Reviewed " + d.toLocaleDateString(undefined, { weekday: "long" }) : `Reviewed ${days} days ago`;
  return { objective: plan.objective, reviewed, overdue: days >= 7 };
}

// Payment terms the founder has not confirmed never push a number past Watch.
function normalise(m) {
  if (m.id === "debtor-days" && SETUP.termsConfirmed === false && m.tone === "act")
    return { ...m, tone: "watch", note: `${m.note || ""} Your payment terms aren't confirmed yet, so this stays at Watch.`.trim() };
  return m;
}

// Needs attention: numbers at Act now, each carrying the work that fixes it when there is some;
// then work Claude can take off the founder's hands; then numbers to watch. Three at most.
function attentionView(measures, hand, mem, now) {
  const flagged = measures.map(normalise).filter((m) => (m.tone === "act" || m.tone === "watch") && fresh(mem, "att-" + m.id, now));
  const used = new Set(), list = [];
  const entry = (m, pair) => {
    const fix = pair && hand.find((h) => !used.has(h.id) && (h.helps || []).some((x) => (m.helps || []).includes(x)));
    if (fix) used.add(fix.id);
    return { ids: ["att-" + m.id].concat(fix ? [fix.id] : []), label: m.label, tone: m.tone, title: m.alert || `${m.label}: ${m.value}`,
      note: fix ? `${fix.line}. ${fix.fact || ""}`.trim() : (m.note || ""),
      item: fix || { id: "att-" + m.id, line: m.label, button: "Ask Claude why", kind: "brief",
        prompt: `Task: My ${m.label.toLowerCase()} is ${m.value}. ${m.note || ""}\n\nFind: the numbers behind it in ${SETUP.moneyTool || "my connected tools"}.\n\nGive me: the biggest reasons in plain words, with the amounts, and the first thing I should do this week. Under 200 words.` } };
  };
  flagged.filter((m) => m.tone === "act").forEach((m) => list.push(entry(m, true)));
  hand.filter((h) => !used.has(h.id)).forEach((h) => list.push({ ids: [h.id], label: "Claude can do this", tone: "hand", title: h.line, note: h.fact || "", item: h }));
  flagged.filter((m) => m.tone === "watch").forEach((m) => list.push(entry(m, false)));
  return list.slice(0, 3);
}

function fullPrompt(item) {

}

let toastTimer;
function toast(text) { if (!text) return; const t = $("toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 3200); }

/* What the page can do in this view: read tools (mcp), ask Claude (sample, with tools), and save
   (artifact). Each is null when not available; the page falls back to copying prompts. */
const caps = { mcp: null, sample: null, tools: false, artifact: null };
const ui = { promptOpen: null, active: null, phase: null, drafts: {}, saved: {}, more: false, all: false, open: {}, review: null };
const state = { items: SETUP.snapshot.items || [], measures: SETUP.snapshot.measures || [], goals: SETUP.goals.map((g) => ({ ...g })),
  clear: SETUP.snapshot.clear || [], live: null, problems: [], rerun: null };
const canDraft = () => !!(caps.sample && caps.tools && caps.mcp && !SETUP.demo);
const canReview = () => !!(canDraft() && caps.artifact);

// The connector tools Claude may read while it drafts or reviews: everything the plays and
// measures read, plus any extra reads Claude proved during setup (SETUP.reads).
function readTool() {
  const allowed = new Set([...PLAYS, ...MEASURES].flatMap((p) => p.tools).concat(SETUP.reads || []).map(([s, t]) => s + "/" + t));
  return {
    name: "read",
    description: "Read from one of my connected tools. `server` and `tool` must be one of: " + [...allowed].join(", ")
      + ". `input` is that tool's arguments. Returns the tool's answer as text, cut to 20,000 characters. Only reads; it never changes anything.",
    inputSchema: { type: "object", properties: { server: { type: "string" }, tool: { type: "string" }, input: { type: "object" } }, required: ["server", "tool"] },
    async execute(input) {
      const server = String(input.server || ""), tool = String(input.tool || "");
      if (!allowed.has(server + "/" + tool)) throw new Error("Not one of the allowed tools: " + [...allowed].join(", "));
      const r = await caps.mcp.callTool(server, tool, input.input && typeof input.input === "object" ? input.input : {});
      const payload = r && r.payload !== undefined ? r.payload : r;
      return (typeof payload === "string" ? payload : JSON.stringify(payload)).slice(0, 20000);
    }
  };
}
function sampleProblem(e) {
  const c = e && e.code;
  if (c === "cancelled") return "";
  if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed", "tools_unavailable"].includes(c)) {
    caps.sample = null; return "Claude can't work on this page. Use Copy prompt instead.";
  }
  if (c === "rate_limited") return e.reason === "usage_limit" ? "You've reached your Claude usage limit for now. Try again later." : "Claude is busy. Try again in a minute.";
  if (c === "session_expired") return "Sign in to Claude again, then try again.";
  return "That didn't work. Try again, or use Copy prompt.";
}
const asText = (v, max) => String(v == null ? "" : v).slice(0, max || 4000);
const validEmail = (s) => /^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(String(s || ""));

// "Do it here": Claude reads the founder's tools and drafts the work on the page. Nothing is sent.
async function doHere(item) {
  ui.active = item.id; ui.phase = "working"; render();

    + " Reply with only JSON: {\"note\": one sentence on what you used and anything I should check, \"drafts\": [{\"kind\": \"email\" | \"post\" | \"note\","
    + " \"to\": the person's name and organisation, or where it goes, \"email\": their email address for an email, else \"\", \"subject\": \"\" when there is none,"
    + " \"body\": plain text, greeting on its own line, blank lines between paragraphs, ending with a sign-off and my first name (not for a note or a brief)}]}."
    + (item.kind === "brief" ? " Return the brief as one draft of kind \"note\", with \"to\" saying what it is for." : "");
  try {
    const r = await caps.sample.json(ask, { tools: [readTool()] });
    const drafts = (r && Array.isArray(r.drafts) ? r.drafts : []).slice(0, 5).map((d) => ({
      kind: ["email", "post", "note"].includes(d && d.kind) ? d.kind : "note", to: asText(d && d.to, 200), email: asText(d && d.email, 200).trim(),
      subject: asText(d && d.subject, 200), body: asText(d && d.body, 6000) })).filter((d) => d.body.trim());
    if (!drafts.length) throw { code: "empty_completion" };

/* The weekly review, on the page. Claude reads the week, asks up to three questions one at a

function reviewContext() {

function reviewedSetup() {

  if (["server_not_connected", "server_not_found", "selection_required"].includes(code)) return `Add ${server} in Claude: Settings → Connectors.`;
  if (["not_in_manifest", "approval_required", "consent_required", "blocked_by_policy", "not_granted"].includes(code)) return `${server} is not allowed for this page yet.`;
  return `${server} didn't answer just now. What you see from it is from ${snapshotLabel().replace("Snapshot · ", "")}.`;

  const items = [], measures = [], clear = [];
  const goals = SETUP.goals.map((g) => ({ ...g }));
  const since = snapshotLabel().replace("Snapshot · ", "");
  // One at a time, so a founder sees one approval question at a time.
  for (const play of PLAYS) {
    try {
      const found = await play.find(read, ctx);
      [].concat(found || []).forEach((it) => items.push({ helps: play.helps, play: play.id, ...it, id: it.id || play.id }));
      if (!found && play.clear) clear.push(play.clear);
    } catch (e) { if (keepOld(play.tools)) items.push(...SETUP.snapshot.items.filter((s) => s.play === play.id)); }
  }
  for (const m of MEASURES) {
    try {
      const found = await m.find(read, ctx);
      if (!found) continue;
      if (m.group === "goal") goals[m.goal || 0] = { ...goals[m.goal || 0], ...found };
      else measures.push({ id: m.id, group: m.group, label: m.label, helps: m.helps, ...found });
    } catch (e) {
      // A goal whose tool failed keeps its last number and says how old it is; it never shows 0.
      if (m.group === "goal") goals[m.goal || 0] = { ...goals[m.goal || 0], stale: since };
      else if (keepOld(m.tools)) measures.push(...(SETUP.snapshot.measures || []).filter((s) => s.id === m.id));
    }
  }
  const servers = new Set([...PLAYS, ...MEASURES].flatMap((p) => p.tools.map((t) => t[0])));
  state.items = items.length || !failed.size ? items : SETUP.snapshot.items;
  state.measures = measures.length || !failed.size ? measures : (SETUP.snapshot.measures || []);
  state.goals = goals;
  state.clear = clear;
  state.problems = [...failed].map(([server, code]) => explain(server, code));
  state.live = failed.size === 0 ? `Live ${at(new Date())}` : failed.size < servers.size ? `Partly live ${at(new Date())}` : null;
  render();
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll("#theme button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.theme === theme)));
}

function start() {
  const hex = /^#[0-9a-f]{6}$/i;
  if (hex.test(SETUP.accent || "")) document.documentElement.style.setProperty("--accent-dark", SETUP.accent);
  if (hex.test(SETUP.accentLight || "")) document.documentElement.style.setProperty("--accent-light", SETUP.accentLight);
  applyTheme(store.get(THEME_KEY, "auto"));
  document.querySelectorAll("#theme button").forEach((b) => b.onclick = () => { store.set(THEME_KEY, b.dataset.theme); applyTheme(b.dataset.theme); });
  $("biz").textContent = SETUP.business || "";
  $("date").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  $("seeall-btn").onclick = () => { ui.all = !ui.all; render(); };
  $("more").onclick = () => { ui.more = !ui.more; render(); };
  render();
  if (SETUP.demo) { selfCheck(); return; }
  if (!window.claude) return;
  const use = (name) => window.claude.use(name).catch(() => null);
  use("sample").then(async (s) => {
    if (!s) return;
    const limits = await s.limits().catch(() => null);
    caps.sample = s; caps.tools = !!(limits && limits.tools); render();
  });
  use("artifact").then((a) => { caps.artifact = a; render(); });
  if (!(PLAYS.length + MEASURES.length)) return;
  use("mcp").then((mcp) => {
    if (!mcp) { state.problems = ["Live data isn't available here. Ask Claude to refresh your What's next dashboard."]; render(); return; }
    caps.mcp = mcp; state.rerun = () => goLive(mcp);
    goLive(mcp);
  });
}
start();
</script>
