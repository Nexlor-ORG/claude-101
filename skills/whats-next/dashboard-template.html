<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's next</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Palette from nexlor.co. The founder's brand colour, when
   there is one, replaces --accent (set from SETUP.accent). Accent is only ever a ring, a wash
   or a glow, never text, so any hue stays readable. */
:root {
  --bg: #F3F1FA; --surface: #FFFFFF; --surface-2: #ECE8F7;
  --text: #17132E; --dim: rgba(23, 19, 46, .68); --hair: rgba(23, 19, 46, .10);
  --accent: #FF7A55; --warm: #B4541F;
  --coral: #FF6B3D; --magenta: #ED1E84; --violet: #7B2FF7;
  --shadow: 0 1px 2px rgba(23, 19, 46, .06), 0 12px 40px rgba(23, 19, 46, .08);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --display: "Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0A1A; --surface: #1B1730; --surface-2: #25203D;
    --text: #F5F4FA; --dim: rgba(245, 244, 250, .70); --hair: rgba(255, 255, 255, .10);
    --warm: #FFB57A; --shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 0 90px rgba(123, 47, 247, .16);
  }
}
:root[data-theme="dark"] {
  --bg: #0C0A1A; --surface: #1B1730; --surface-2: #25203D;
  --text: #F5F4FA; --dim: rgba(245, 244, 250, .70); --hair: rgba(255, 255, 255, .10);
  --warm: #FFB57A; --shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 0 90px rgba(123, 47, 247, .16);
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
  font: 15px/1.5 var(--body); font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
h1, h2, p, ol, ul { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.frame { max-width: 760px; margin: 0 auto; background: var(--surface); border-radius: 24px;
  box-shadow: var(--shadow); overflow: hidden; }
.ribbon { height: 4px; background: linear-gradient(115deg, var(--coral), var(--magenta) 48%, var(--violet)); }
.pad { padding: 18px 18px 20px; display: grid; gap: 20px; }

.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--dim); }
.brand { font-weight: 600; color: var(--text); }
.hero h1 { font: 500 clamp(28px, 6vw, 40px)/1.08 var(--display); letter-spacing: -.03em; }
.hero p { color: var(--dim); margin-top: 6px; }

.label { font: 600 12.5px/1 var(--body); letter-spacing: .02em; color: var(--dim); margin-bottom: 10px; }
.next { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; padding: 16px;
  border-radius: 18px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--hair); }
.item.lead { box-shadow: inset 0 0 0 1.5px var(--accent);
  background: radial-gradient(90% 120% at 0% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%), var(--surface-2); }
.n { grid-row: span 2; align-self: start; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center;
  font: 600 14px/1 var(--display); box-shadow: inset 0 0 0 1.5px var(--accent); }
.line { font: 600 17px/1.3 var(--body); letter-spacing: -.01em; overflow-wrap: anywhere; }
.fact { color: var(--dim); overflow-wrap: anywhere; }
.item .line, .item .fact { grid-column: 2; }
.acts { grid-column: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.btn { display: inline-block; padding: 9px 18px; border-radius: 99px; font-weight: 600; font-size: 14px; text-decoration: none;
  background: var(--text); color: var(--surface); transition: transform 160ms var(--ease-out); }
.btn.quiet { background: transparent; color: var(--dim); box-shadow: inset 0 0 0 1px var(--hair); font-weight: 500; }
.btn.sm { padding: 6px 13px; font-size: 13px; }
.btn:active { transform: scale(.97); }

.hand li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px;
  padding: 12px 16px; border-radius: 16px; box-shadow: inset 0 0 0 1px var(--hair); }
.hand li + li { margin-top: 8px; }
.empty { padding: 18px 16px; border-radius: 18px; background: var(--surface-2); color: var(--dim); }

.notices { display: grid; gap: 6px; font-size: 13.5px; }
.notices li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px;
  padding: 9px 14px; border-radius: 14px; color: var(--warm); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warm) 35%, transparent); }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-size: 13px; color: var(--dim);
  padding-top: 14px; border-top: 1px solid var(--hair); }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  padding: 10px 18px; border-radius: 99px; background: var(--text); color: var(--surface); font-weight: 600; font-size: 14px;
  transition: opacity 200ms ease, transform 200ms var(--ease-out); max-width: calc(100vw - 32px); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
[hidden] { display: none !important; }

@media (min-width: 640px) {
  body { padding: 28px; }
  .pad { padding: 24px 30px 26px; gap: 24px; }
  .item { grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; padding: 18px 20px; }
  .n { grid-row: span 2; }
  .acts { grid-column: 3; grid-row: 1 / span 2; margin-top: 0; justify-content: flex-end; max-width: 300px; }
}
@media (prefers-reduced-motion: reduce) { .btn, #toast { transition: none; } }
</style>
</head>
<body>
<main class="frame">
  <div class="ribbon"></div>
  <div class="pad">
    <header class="top"><span class="brand" id="biz"></span><span id="status"></span></header>
    <section class="hero"><h1 id="hello"></h1><p id="goal"></p></section>
    <section>
      <h2 class="label">What's next</h2>
      <ol class="next" id="next"></ol>
      <p class="empty" id="empty" hidden>Nothing needs you right now.</p>
    </section>
    <section id="hand-wrap" hidden>
      <h2 class="label">Claude can take this off your hands</h2>
      <ul class="hand" id="hand"></ul>
    </section>
    <ul class="notices" id="notices"></ul>
    <footer class="foot"><span id="more"></span><span>Claude 101 by Nexlor</span></footer>
  </div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================================================
   1. SETUP — the founder's saved setup. Claude replaces this whole object (see dashboard.md).
      The demo below is an invented business; `demo: true` also runs the self-check.
   ============================================================================================ */
const SETUP = {
  demo: true,
  version: 1,
  founder: "Thandi",
  business: "Demo Uniforms",
  goal: "15 schools on contract by June",
  // What counts as important for this founder. Labels: win-customers, keep-customers,
  // get-paid, deliver-work, save-time.
  focus: ["win-customers", "keep-customers"],
  // The "here's what I heard" lines, kept so setup can be resumed and updated later.
  heard: [
    "You make school uniforms and sell mostly to schools around Cape Town.",
    "A great six months is 15 schools on contract, up from 11.",
    "What matters most is keeping your biggest schools ordering.",
    "You would hand off chasing payments tomorrow.",
    "Day to day you use Gmail, Google Calendar, Xero and Shopify."
  ],
  tools: { connected: ["Gmail", "Google Calendar"], next: ["Shopify"], notYet: ["Payfast"] },
  accent: "#1F9D6B",
  // What the plays found the last time Claude ran them. Shown until live data arrives, and
  // whenever live data is not available.
  snapshot: {
    takenAt: "2026-11-23T07:02:00+02:00",
    items: [
      { id: "demo-quiet-customers", play: "demo", helps: ["keep-customers"], urgent: false,
        line: "Call your three biggest customers", fact: "None has ordered in two months",
        button: "Have Claude draft the messages",
        prompt: "Draft a short, friendly check-in message to each of my three biggest customers, who have not ordered in two months. Show me the drafts before anything is sent." },
      { id: "demo-quote", play: "demo", helps: ["win-customers"], urgent: true,
        line: "Renew the Hillside Primary quote", fact: "It expires tomorrow",
        button: "Have Claude draft it",
        prompt: "Draft an email renewing my quote to Hillside Primary, which expires tomorrow. Show me the draft before anything is sent." },
      { id: "demo-follow-up", play: "demo", helps: ["win-customers"], urgent: false,
        line: "Follow up Friday's call with Sipho", fact: "No email to him since the call",
        button: "Have Claude draft it",
        prompt: "Draft a follow-up email to Sipho after our call on Friday. Show me the draft before anything is sent." },
      { id: "demo-invoices", play: "demo", helps: ["get-paid"], urgent: true,
        line: "Chase 2 overdue invoices", fact: "R48,200 outstanding",
        button: "Draft reminders",
        prompt: "Draft polite payment reminders for my two overdue invoices. Show me the drafts before anything is sent." },
      { id: "demo-newsletter", play: "demo", helps: ["save-time"], urgent: false,
        line: "Read last month's newsletter stats", fact: "Open rate was 31%" }
    ]
  }
};

/* ============================================================================================
   2. PLAYS — what the dashboard knows how to notice. Claude keeps the plays for the tools this
      founder has connected, removes the rest, and adds plays it wrote and proved during setup
      (see plays.md). Each play reads through `read(server, tool, input)` and returns one item,
      or null when there is nothing to do.
   ============================================================================================ */
const DAY = 864e5;
const gmailDate = (d) => `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
const localTime = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 19);
const clean = (s) => String(s || "").replace(/[\r\n<>]/g, " ").trim().slice(0, 60);
const listNames = (names) => names.length <= 2 ? names.join(" and ") : `${names[0]}, ${names[1]} and ${names.length - 2} more`;
const robot = /no-?reply|notification|mailer|newsletter|donotreply|support@|billing@|info@/i;
// Gmail gives `sender` as an address and the display names in a separate list.
const gmailName = (msg, address) => {
  const hit = (msg.addressDisplayNames || []).find((a) => a.emailAddress === address);
  return clean((hit && hit.displayName) || String(address || "").split("@")[0]);
};
// People on a calendar event who are not the founder and not in the founder's own domain.
const outsiders = (event, ownDomain) => (event.attendees || [])
  .filter((a) => a.email && !a.self && !a.resource && !a.email.endsWith("@" + ownDomain));
const attendeeName = (a) => clean(a.displayName || a.email.split("@")[0]);

const PLAYS = [
  {
    id: "gmail-waiting-on-you",
    what: "People who emailed in the last two weeks and have waited more than two days for a reply.",
    helps: ["keep-customers", "win-customers"],
    tools: [["Gmail", "search_threads"]],
    async find(read, ctx) {
      const r = await read("Gmail", "search_threads",
        { query: "in:inbox category:primary newer_than:14d older_than:2d -from:me", pageSize: 30 });
      const waiting = (r.threads || []).map((t) => (t.messages || []).at(-1))
        .filter((m) => m && !(m.labelIds || []).includes("SENT") && !robot.test(m.sender));
      if (!waiting.length) return null;
      const names = [...new Set(waiting.map((m) => gmailName(m, m.sender)))];
      const oldest = Math.min(...waiting.map((m) => Date.parse(m.date)));
      return {
        line: `Reply to ${listNames(names)}`,
        fact: waiting.length === 1 ? "1 email has waited more than two days" : `${waiting.length} emails have waited more than two days`,
        urgent: ctx.now - oldest > 4 * DAY,
        button: "Have Claude draft replies",
        prompt: `Find the emails in my inbox from ${listNames(names)} that have waited more than two days for a reply, and draft a reply to each. Show me every draft before anything is sent.`
      };
    }
  },
  {
    id: "gmail-no-reply-to-you",
    what: "Emails the founder sent 4 to 14 days ago that nobody has answered.",
    helps: ["win-customers"],
    tools: [["Gmail", "search_threads"]],
    async find(read) {
      const r = await read("Gmail", "search_threads", { query: "in:sent newer_than:14d older_than:4d", pageSize: 30 });
      const silent = (r.threads || []).map((t) => (t.messages || []).at(-1))
        .filter((m) => m && (m.labelIds || []).includes("SENT") && (m.toRecipients || []).length && !robot.test(m.toRecipients[0]));
      if (!silent.length) return null;
      const names = [...new Set(silent.map((m) => gmailName(m, m.toRecipients[0])))];
      return {
        line: `Follow up with ${listNames(names)}`,
        fact: silent.length === 1 ? "1 email you sent has had no reply in four days" : `${silent.length} emails you sent have had no reply in four days`,
        urgent: false,
        button: "Have Claude draft follow-ups",
        prompt: `Find the emails I sent to ${listNames(names)} in the last two weeks that have had no reply, and draft a short follow-up to each. Show me every draft before anything is sent.`
      };
    }
  },
  {
    id: "calendar-prepare",
    what: "Meetings in the next two days with people outside the business.",
    helps: ["win-customers", "keep-customers", "deliver-work"],
    tools: [["Google Calendar", "list_events"]],
    async find(read, ctx) {
      const r = await read("Google Calendar", "list_events", {
        startTime: localTime(ctx.now), endTime: localTime(new Date(ctx.now.getTime() + 2 * DAY)), orderBy: "startTime", pageSize: 25 });
      const own = String(r.summary || "").split("@")[1] || "";
      const meetings = (r.events || []).filter((e) => e.status !== "cancelled" && e.start && e.start.dateTime && outsiders(e, own).length);
      if (!meetings.length) return null;
      const first = meetings[0], start = new Date(first.start.dateTime);
      const when = start.toLocaleString(undefined, { weekday: "long", hour: "numeric", minute: "2-digit" });
      const who = listNames(outsiders(first, own).map(attendeeName));
      return {
        line: `Prepare for ${clean(first.summary) || "your meeting"}`,
        fact: `${when}, with ${who}` + (meetings.length > 1 ? `. ${meetings.length - 1} more outside meeting${meetings.length > 2 ? "s" : ""} in the next two days` : ""),
        urgent: start - ctx.now < DAY,
        button: "Have Claude prepare a brief",
        prompt: `I have a meeting, "${clean(first.summary)}", on ${when} with ${who}. From my email and calendar, prepare a one-page brief: who they are, what we last discussed, and what I should ask for.`
      };
    }
  },
  {
    id: "calendar-follow-up",
    what: "Meetings in the past week with someone outside the business, with no email to them since.",
    helps: ["win-customers", "keep-customers"],
    tools: [["Google Calendar", "list_events"], ["Gmail", "search_threads"]],
    async find(read, ctx) {
      const r = await read("Google Calendar", "list_events", {
        startTime: localTime(new Date(ctx.now.getTime() - 7 * DAY)), endTime: localTime(ctx.now), orderBy: "startTimeDesc", pageSize: 25 });
      const own = String(r.summary || "").split("@")[1] || "";
      const held = (r.events || []).filter((e) => e.status !== "cancelled" && e.end && e.end.dateTime && outsiders(e, own).length).slice(0, 5);
      const open = [];
      for (const e of held) {
        const guest = outsiders(e, own)[0];
        // Gmail's `after:` counts from midnight, so an email sent earlier on the meeting day counts as a follow-up.
        const sent = await read("Gmail", "search_threads", { query: `in:sent to:${guest.email} after:${gmailDate(new Date(e.end.dateTime))}`, pageSize: 1 });
        if (!(sent.threads || []).length) open.push({ e, guest });
      }
      if (!open.length) return null;
      const { e, guest } = open[0];
      const day = new Date(e.end.dateTime).toLocaleString(undefined, { weekday: "long" });
      return {
        line: `Follow up ${day}'s meeting with ${attendeeName(guest)}`,
        fact: `No email to them since "${clean(e.summary)}"` + (open.length > 1 ? `. ${open.length - 1} more like this` : ""),
        urgent: false,
        button: "Have Claude draft it",
        prompt: `Draft a follow-up email to ${attendeeName(guest)} after our meeting "${clean(e.summary)}" on ${day}. Use what you can find in my email for context. Show me the draft before anything is sent.`
      };
    }
  }
];

/* ============================================================================================
   3. THE PAGE — do not change below this line when filling in a founder's dashboard.
   ============================================================================================ */
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

// ponytail: "done" and "not for me" are remembered per browser (localStorage). Move this to
// the artifact `db` capability once founders open the dashboard on more than one device.
const MEMORY_KEY = "whats-next-memory-v1";
const memory = {
  read() { try { return JSON.parse(localStorage.getItem(MEMORY_KEY)) || {}; } catch { return {}; } },
  mark(id, kind) { const m = this.read(); m[id] = { kind, at: Date.now() }; try { localStorage.setItem(MEMORY_KEY, JSON.stringify(m)); } catch {} }
};

// The Eisenhower rule. Important = the item helps something in the founder's focus.
// Urgent and important first, then important. Urgent but not important is offered to Claude.
// Neither is never shown. Done items stay away for a week; "not for me" items stay away.
function choose(items, focus, mem, now) {
  const open = items.filter((i) => {
    const m = mem[i.id];
    return !m || (m.kind === "done" && now - m.at >= 7 * DAY);
  }).map((i) => ({ ...i, important: (i.helps || []).some((h) => focus.includes(h)), again: !!mem[i.id] }));
  const score = (i) => (i.urgent ? 1 : 0);
  return {
    next: open.filter((i) => i.important).sort((a, b) => score(b) - score(a)).slice(0, 3),
    hand: open.filter((i) => !i.important && i.urgent).slice(0, 2)
  };
}

function selfCheck() {
  const items = SETUP.snapshot.items, focus = ["win-customers", "keep-customers"], fails = [];
  const ok = (cond, what) => { if (!cond) fails.push(what); };
  let r = choose(items, focus, {}, 0);
  ok(r.next.length === 3 && r.next[0].id === "demo-quote", "urgent and important leads");
  ok(r.hand.length === 1 && r.hand[0].id === "demo-invoices", "urgent but not important is offered to Claude");
  ok(![...r.next, ...r.hand].some((i) => i.id === "demo-newsletter"), "neither urgent nor important is never shown");
  r = choose(items, focus, { "demo-quote": { kind: "done", at: 0 } }, DAY);
  ok(r.next.length === 2, "a done item leaves and the list is not padded");
  r = choose(items, focus, { "demo-quote": { kind: "done", at: 0 } }, 8 * DAY);
  ok(r.next.length === 3 && r.next[0].again, "a done item returns after a week");
  r = choose(items, focus, { "demo-quote": { kind: "skip", at: 0 } }, 999 * DAY);
  ok(r.next.length === 2, "a not-for-me item stays away");
  console.log("whats-next self-check:", fails.length ? fails : "ok");
}

let toastTimer;
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 3200); }

// Handing a job to Claude: copy a ready-made request for the founder to paste into Claude.
// ponytail: copy-and-paste always works. Replace with a direct hand-off if testing finds one.
async function handToClaude(item) {
  try { await navigator.clipboard.writeText(item.prompt); toast("Copied. Paste it into Claude."); }
  catch { toast("Couldn't copy. Ask Claude: " + item.line); }
}

function actions(item, small) {
  const wrap = el("div", "acts");
  if (item.link) { const a = el("a", "btn" + (small ? " sm" : ""), item.button || "Open it"); a.href = item.link; a.target = "_blank"; a.rel = "noopener"; wrap.append(a); }
  else if (item.prompt) { const b = el("button", "btn" + (small ? " sm" : ""), item.button || "Have Claude do it"); b.onclick = () => handToClaude(item); wrap.append(b); }
  const done = el("button", "btn quiet sm", "Done"); done.onclick = () => { memory.mark(item.id, "done"); render(); };
  const skip = el("button", "btn quiet sm", "Not for me"); skip.onclick = () => { memory.mark(item.id, "skip"); render(); };
  wrap.append(done, skip);
  return wrap;
}

const state = { items: SETUP.snapshot.items, status: "", problems: [], rerun: null };

function render() {
  const { next, hand } = choose(state.items, SETUP.focus || [], memory.read(), Date.now());
  const list = $("next"); list.replaceChildren();
  next.forEach((item, i) => {
    const li = el("li", "item" + (i === 0 ? " lead" : ""));
    li.append(el("span", "n", i + 1), el("p", "line", item.line), el("p", "fact", (item.again ? "Still open. " : "") + (item.fact || "")), actions(item));
    list.append(li);
  });
  $("empty").hidden = next.length > 0;
  const handList = $("hand"); handList.replaceChildren();
  hand.forEach((item) => {
    const li = el("li"), text = el("div");
    text.append(el("p", "line", item.line), el("p", "fact", item.fact || ""));
    li.append(text, actions(item, true));
    handList.append(li);
  });
  $("hand-wrap").hidden = hand.length === 0;
  $("status").textContent = state.status;
  const notices = $("notices"); notices.replaceChildren();
  state.problems.forEach((text) => notices.append(el("li", "", text)));
  if (state.problems.length && state.rerun) {
    const again = el("button", "btn quiet sm", "Try again"); again.onclick = state.rerun;
    notices.lastChild.append(again);
  }
}

const at = (d) => d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
const snapshotLabel = () => {
  const d = new Date(SETUP.snapshot.takenAt);
  return isNaN(d) ? "Snapshot" : `Snapshot · ${d.toLocaleDateString(undefined, { day: "numeric", month: "short" })}, ${at(d)}`;
};

// What to tell the founder when a tool cannot be read. One line per tool, by cause.
function explain(server, code) {
  if (code === "needs_reauth") return `Reconnect ${server} in Claude: Settings → Connectors.`;
  if (["server_not_connected", "server_not_found", "selection_required"].includes(code)) return `Add ${server} in Claude: Settings → Connectors.`;
  if (["not_in_manifest", "approval_required", "consent_required", "blocked_by_policy", "not_granted"].includes(code)) return `${server} is not allowed for this page yet.`;
  return `${server} did not answer just now. Showing the last snapshot for it.`;
}
const transient = (code) => ["server_unavailable", "upstream_error", "rate_limited", "cancelled"].includes(code);

async function goLive(mcp) {
  state.status = "Checking your tools…"; state.problems = []; render();
  const failed = new Map();            // server -> error code
  const read = async (server, tool, input) => {
    try { return (await mcp.callTool(server, tool, input || {}, { cache: { staleTime: 5 * 60e3, gcTime: 60 * 60e3 } })).payload || {}; }
    catch (e) { failed.set((e && e.server) || server, (e && e.code) || "upstream_error"); throw e; }
  };
  const ctx = { now: new Date(), setup: SETUP };
  const items = [];
  // One play at a time, so a founder sees one approval question at a time.
  for (const play of PLAYS) {
    try {
      const found = await play.find(read, ctx);
      [].concat(found || []).forEach((it) => items.push({ helps: play.helps, play: play.id, ...it, id: it.id || play.id }));
    } catch (e) {
      // Keep this play's last snapshot item only when the failure was a passing one.
      const codes = play.tools.map(([server]) => failed.get(server)).filter(Boolean);
      if (codes.length && codes.every(transient)) items.push(...SETUP.snapshot.items.filter((s) => s.play === play.id));
    }
  }
  state.items = items;
  state.problems = [...failed].map(([server, code]) => explain(server, code));
  state.status = failed.size === 0 ? `Live · ${at(new Date())}` : failed.size < new Set(PLAYS.flatMap((p) => p.tools.map((t) => t[0]))).size ? `Partly live · ${at(new Date())}` : snapshotLabel();
  if (failed.size && !items.length) state.items = SETUP.snapshot.items;
  render();
}

function start() {
  if (/^#[0-9a-f]{6}$/i.test(SETUP.accent || "")) document.documentElement.style.setProperty("--accent", SETUP.accent);
  const hour = new Date().getHours();
  $("hello").textContent = `Good ${hour < 12 ? "morning" : hour < 18 ? "afternoon" : "evening"}${SETUP.founder ? ", " + SETUP.founder : ""}`;
  $("biz").textContent = SETUP.business || "";
  $("goal").textContent = SETUP.goal ? "Goal: " + SETUP.goal : "";
  const next = (SETUP.tools && SETUP.tools.next) || [];
  $("more").textContent = next.length ? `Connect ${next[0]} to see more: ask Claude to add it to your dashboard.` : "";
  state.status = snapshotLabel();
  render();
  if (SETUP.demo) selfCheck();
  if (!window.claude || !PLAYS.length || SETUP.demo) return;
  window.claude.use("mcp").then((mcp) => {
    if (!mcp) { state.problems = ["Live data isn't available here. Ask Claude to refresh your What's next dashboard."]; render(); return; }
    state.rerun = () => goLive(mcp);
    goLive(mcp);
  }).catch(() => {});
}
start();
</script>
</body>
