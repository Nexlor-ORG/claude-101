<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's next</title>
<style>
/* Central Inbox's system (a framed surface, tiles lit from the top edge, a lead and a queue, pill
   buttons) on Nexlor's colours. Light is the default; dark follows the device or the switch.
   The founder's brand colour is the accent: --accent-light on light, --accent-dark on dark. */
:root {
  --accent-light: #B23A16; --accent-dark: #FF9A7A; --accent: var(--accent-light);
  --surface: #FFFFFF; --text: #17132E; --dim: rgba(23,19,46,.68); --hair: rgba(23,19,46,.09); --ink: #FFFFFF;
  --night: #EFEBF7; --g1: #D8C9F6; --g2: #F6D2E3; --halo: rgba(123,47,247,.10);
  --wash: color-mix(in srgb, var(--accent) 12%, transparent); --ring: color-mix(in srgb, var(--accent) 38%, transparent);
  --tile: rgba(23,19,46,.025); --tile-edge: inset 0 0 0 1px rgba(23,19,46,.07); --tile-lead-edge: inset 0 0 0 1px var(--ring);
  --quiet: rgba(23,19,46,.06); --quiet-edge: inset 0 0 0 1px rgba(23,19,46,.06); --quiet-hover: rgba(23,19,46,.11);
  --btn-hover: #2E2858; --chip: rgba(23,19,46,.07); --current: rgba(23,19,46,.06); --row-hover: rgba(23,19,46,.035); --track: rgba(23,19,46,.08);
  --good: #1E6B45; --good-bg: rgba(30,107,69,.10); --watch: #8A5300; --watch-bg: rgba(214,138,36,.16); --act: #A3261E; --act-bg: rgba(163,38,30,.09);
  --act-tile: radial-gradient(90% 80% at 100% 0%, rgba(163,38,30,.07), transparent 70%), #FFFFFF; --act-edge: inset 0 0 0 1px rgba(163,38,30,.22);
  --underline: rgba(23,19,46,.35); --ease-out: cubic-bezier(.23, 1, .32, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: var(--accent-dark);
    --surface: #0D0B16; --text: #FCF7FD; --dim: rgba(252,247,253,.68); --hair: rgba(252,247,253,.08); --ink: #150A33;
    --night: #0B0918; --g1: #3B1A78; --g2: #6A1C4C; --halo: rgba(110,48,193,.40);
    --wash: color-mix(in srgb, var(--accent) 30%, transparent); --ring: color-mix(in srgb, var(--accent) 42%, transparent);
    --tile: rgba(252,247,253,.04); --tile-edge: inset 0 1px 0 rgba(252,247,253,.11), inset 0 0 0 1px rgba(252,247,253,.045);
    --tile-lead-edge: inset 0 1px 0 rgba(252,247,253,.16), inset 0 0 0 1px var(--ring);
    --quiet: rgba(252,247,253,.09); --quiet-edge: inset 0 1px 0 rgba(252,247,253,.14); --quiet-hover: rgba(252,247,253,.16);
    --btn-hover: #FFFFFF; --chip: rgba(252,247,253,.07); --current: rgba(252,247,253,.10); --row-hover: rgba(252,247,253,.06); --track: rgba(252,247,253,.08);
    --good: #8EE0B2; --good-bg: rgba(142,224,178,.12); --watch: #FFB57A; --watch-bg: rgba(255,181,122,.13); --act: #FF9A8F; --act-bg: rgba(255,154,143,.14);
    --act-tile: radial-gradient(90% 80% at 100% 0%, rgba(255,154,143,.14), transparent 70%), rgba(252,247,253,.04);
    --act-edge: inset 0 1px 0 rgba(255,154,143,.35), inset 0 0 0 1px rgba(255,154,143,.22);
    --underline: rgba(252,247,253,.35);
  }
}
:root[data-theme="dark"] {
  --accent: var(--accent-dark);
  --surface: #0D0B16; --text: #FCF7FD; --dim: rgba(252,247,253,.68); --hair: rgba(252,247,253,.08); --ink: #150A33;
  --night: #0B0918; --g1: #3B1A78; --g2: #6A1C4C; --halo: rgba(110,48,193,.40);
  --wash: color-mix(in srgb, var(--accent) 30%, transparent); --ring: color-mix(in srgb, var(--accent) 42%, transparent);
  --tile: rgba(252,247,253,.04); --tile-edge: inset 0 1px 0 rgba(252,247,253,.11), inset 0 0 0 1px rgba(252,247,253,.045);
  --tile-lead-edge: inset 0 1px 0 rgba(252,247,253,.16), inset 0 0 0 1px var(--ring);
  --quiet: rgba(252,247,253,.09); --quiet-edge: inset 0 1px 0 rgba(252,247,253,.14); --quiet-hover: rgba(252,247,253,.16);
  --btn-hover: #FFFFFF; --chip: rgba(252,247,253,.07); --current: rgba(252,247,253,.10); --row-hover: rgba(252,247,253,.06); --track: rgba(252,247,253,.08);
  --good: #8EE0B2; --good-bg: rgba(142,224,178,.12); --watch: #FFB57A; --watch-bg: rgba(255,181,122,.13); --act: #FF9A8F; --act-bg: rgba(255,154,143,.14);
  --act-tile: radial-gradient(90% 80% at 100% 0%, rgba(255,154,143,.14), transparent 70%), rgba(252,247,253,.04);
  --act-edge: inset 0 1px 0 rgba(255,154,143,.35), inset 0 0 0 1px rgba(255,154,143,.22);
  --underline: rgba(252,247,253,.35);
}
* { box-sizing: border-box; }
body { margin: 0; padding: 12px; min-height: 100vh; color: var(--text); background-color: var(--night);
  background: radial-gradient(55% 60% at 8% 100%, var(--g1) 0%, transparent 62%), radial-gradient(50% 55% at 95% 0%, var(--g2) 0%, transparent 60%), var(--night);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; font-optical-sizing: auto; font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
:where(h1, h2, h3, p, ul, ol) { margin: 0; }
:where(ul, ol) { padding: 0; list-style: none; }
:where(button) { font: inherit; color: inherit; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.frame { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding: 12px 26px 16px; border-radius: 28px;
  background: var(--surface); box-shadow: 0 0 0 1px var(--ring), 0 0 90px var(--halo); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 36px; }
.brand { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.right { display: flex; align-items: center; gap: 14px; color: var(--dim); font-size: 13px; }
.seg { display: flex; gap: 2px; padding: 4px; border-radius: 99px; background: var(--quiet); box-shadow: var(--quiet-edge); }
.seg button { min-height: 30px; padding: 0 13px; border-radius: 99px; color: var(--dim); font-size: 12.5px; transition: background-color 160ms ease, color 160ms ease; }
.seg button[aria-pressed="true"] { background: var(--current); color: var(--text); box-shadow: var(--quiet-edge); }
.live { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }
.live.old i { background: var(--watch); box-shadow: 0 0 0 3px var(--watch-bg); }

.hero { display: flex; align-items: end; justify-content: space-between; gap: 30px; padding: 10px 2px 4px; }
.hero h1 { font-size: clamp(32px, 3.6vw, 52px); font-weight: 400; letter-spacing: -.04em; line-height: 1.02; text-wrap: balance; }
.hero .n { display: inline-grid; place-items: center; min-width: 1.5em; height: 1.12em; padding: 0 .3em; margin-right: .22em; border-radius: .34em; vertical-align: -.12em;
  box-shadow: inset 0 0 0 1.5px var(--accent); background: linear-gradient(160deg, var(--wash), transparent); font-size: .82em; }
.hero p { color: var(--dim); text-align: right; max-width: 44ch; }
.notices { display: grid; gap: 6px; font-size: 13px; }
.notices li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 7px 8px 7px 16px; border-radius: 99px;
  color: var(--watch); background: var(--watch-bg); }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.tile { min-width: 0; border-radius: 20px; padding: 16px 18px; background: var(--tile); box-shadow: var(--tile-edge); }
.label { font-size: 12.5px; font-weight: 500; letter-spacing: .01em; color: var(--dim); display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.tag { display: inline-block; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 99px; background: var(--wash); color: var(--accent); white-space: nowrap; }

.goal { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 28px; align-items: center; padding: 16px 22px; }
.goal h2 { font-size: 17px; font-weight: 500; letter-spacing: -.01em; line-height: 1.25; }
.goal .big { font-size: 40px; font-weight: 400; letter-spacing: -.04em; line-height: 1; }
.goal .of { color: var(--dim); font-size: 13px; margin-left: 6px; }
.goal .count { display: flex; align-items: baseline; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.goal .bar, .goal .pace, .goal .key { grid-column: 1 / -1; }
.key { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--dim); }
.key b { color: var(--text); font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }

.lead { grid-column: 1 / 8; grid-row: span 2; display: flex; flex-direction: column; gap: 14px; padding: 20px 22px;
  background: radial-gradient(90% 70% at 0% 0%, var(--wash), transparent 70%), var(--tile); box-shadow: var(--tile-lead-edge); }
.lead-body { display: flex; flex-direction: column; gap: 14px; flex: 1; animation: 240ms var(--ease-out) both; }
@keyframes in-a { from { opacity: 0; transform: translateY(5px); filter: blur(2px); } }
@keyframes in-b { from { opacity: 0; transform: translateY(5px); filter: blur(2px); } }
.who { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; color: var(--dim); font-size: 13px; }
.lead h2 { font-size: clamp(22px, 2.3vw, 32px); font-weight: 500; letter-spacing: -.03em; line-height: 1.08; text-wrap: balance; overflow-wrap: anywhere; }
.said { color: var(--dim); font-size: 15px; max-width: 52ch; overflow-wrap: anywhere; }
.ctx li { display: flex; gap: 10px; padding: 7px 0; box-shadow: inset 0 1px 0 var(--hair); font-size: 13.5px; overflow-wrap: anywhere; }
.ctx li::before { content: ""; flex: none; width: 5px; height: 5px; margin-top: 7px; border-radius: 50%; background: var(--accent); }
.acts { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.acts .pos { margin-left: auto; color: var(--dim); font-size: 12.5px; }
.btn { display: inline-flex; align-items: center; min-height: 40px; padding: 0 20px; border-radius: 99px; font-weight: 600; font-size: 13.5px; text-decoration: none;
  background: var(--text); color: var(--ink); white-space: nowrap; transition: transform 160ms var(--ease-out), background-color 160ms ease; }
.btn.quiet { background: var(--quiet); color: var(--text); box-shadow: var(--quiet-edge); }
.btn.sm { min-height: 34px; padding: 0 14px; font-size: 12.5px; }
.btn:active { transform: scale(.97); }
.zero { display: grid; place-content: center; text-align: center; gap: 8px; min-height: 240px; }
.zero h2 { font-size: clamp(28px, 3vw, 40px); font-weight: 400; letter-spacing: -.04em; }
.zero p { color: var(--dim); }

.queue { grid-column: 8 / 13; padding: 16px 10px; }
.queue .label { padding: 0 8px; }
.qi { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px; border-radius: 12px; transition: background-color 160ms ease; }
.qi[aria-current="true"] { background: var(--current); }
.qi .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); font-size: 12px; font-weight: 600; }
.qi[aria-current="true"] .num { box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--wash); }
.qi .t { display: block; font-size: 14.5px; font-weight: 500; letter-spacing: -.01em; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qi .f { display: block; font-size: 12.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.side { grid-column: 8 / 13; display: flex; flex-direction: column; gap: 4px; }
.side h3 { font-size: 17px; font-weight: 500; letter-spacing: -.02em; line-height: 1.2; overflow-wrap: anywhere; }
.side p { font-size: 13px; color: var(--dim); margin-bottom: 10px; }
.side .acts { margin-top: 0; }
.side.act { background: var(--act-tile); box-shadow: var(--act-edge); }
.side.act .label { color: var(--act); }

.section-head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 2px 0; font-size: 12.5px; color: var(--dim); }
.section-head h2 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: var(--text); }
.metrics { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.metric { display: flex; flex-direction: column; gap: 6px; }
.metric .label { margin-bottom: 2px; align-items: center; }
.metric .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.metric .big { font-size: 30px; font-weight: 400; letter-spacing: -.04em; line-height: 1.05; }
.metric .note { font-size: 12.5px; color: var(--dim); line-height: 1.45; }
.tone { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.good { color: var(--good); } .watch { color: var(--watch); } .act { color: var(--act); }
.tone.good { background: var(--good-bg); } .tone.watch { background: var(--watch-bg); } .tone.act { background: var(--act-bg); }
.spark { flex: none; stroke: currentColor; }
.quietlink { align-self: flex-start; min-height: 32px; color: var(--dim); font-size: 12.5px; text-decoration: underline dotted var(--underline); text-underline-offset: 3px; transition: color 160ms ease; }
.how { padding-top: 8px; box-shadow: inset 0 1px 0 var(--hair); font-size: 12.5px; line-height: 1.5; color: var(--dim); transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
@starting-style { .how { opacity: 0; transform: translateY(-4px); } }
.connect { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 20px 22px;
  background: radial-gradient(90% 90% at 0% 0%, var(--wash), transparent 70%), var(--tile); }
.connect h3 { font-size: 20px; font-weight: 500; letter-spacing: -.02em; }
.connect p { color: var(--dim); max-width: 62ch; margin-bottom: 6px; }
.strip { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; padding: 12px 4px 0; box-shadow: inset 0 1px 0 var(--hair); font-size: 12.5px; color: var(--dim); }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; z-index: 5; max-width: calc(100vw - 32px);
  padding: 10px 18px; border-radius: 99px; background: var(--text); color: var(--ink); font-weight: 600; font-size: 13.5px;
  transition: opacity 200ms ease, transform 200ms var(--ease-out); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (hover: hover) and (pointer: fine) {
  .btn:hover { background: var(--btn-hover); }
  .btn.quiet:hover { background: var(--quiet-hover); }
  .qi:hover { background: var(--row-hover); }
  .qi[aria-current="true"]:hover { background: var(--current); }
  .quietlink:hover, .seg button:hover { color: var(--text); }
}
@media (max-width: 860px) {
  body { padding: 8px; }
  .frame { padding: 10px 16px 16px; border-radius: 24px; }
  .top { flex-wrap: wrap; }
  .hero { flex-direction: column; align-items: flex-start; gap: 10px; }
  .hero p { text-align: left; }
  .lead, .queue, .side { grid-column: 1 / -1; grid-row: auto; }
  .goal { grid-template-columns: minmax(0, 1fr); }
  .goal .count { justify-content: flex-start; }
  .right .date { display: none; }
  .right { width: 100%; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
  .acts .pos { width: 100%; margin-left: 0; order: -1; }
}
@media (prefers-reduced-motion: reduce) {
  @keyframes in-a { from { opacity: 0; } }
  @keyframes in-b { from { opacity: 0; } }
  .btn, .qi, .quietlink, .seg button, #toast { transition: none; }
  .btn:active { transform: none; }
  .how { transition: opacity 150ms ease; }
  @starting-style { .how { opacity: 0; transform: none; } }
}
</style>
</head>
<body>
<div class="frame">
  <header class="top">
    <span class="brand" id="biz"></span>
    <span class="right">
      <span class="date" id="date"></span>
      <span class="live" id="status"><i aria-hidden="true"></i><span></span></span>
      <span class="seg" role="group" aria-label="Appearance" id="theme">
        <button type="button" data-theme="auto">Auto</button><button type="button" data-theme="light">Light</button><button type="button" data-theme="dark">Dark</button>
      </span>
    </span>
  </header>
  <section class="hero"><h1 id="headline"></h1><p id="hello"></p></section>
  <ul class="notices" id="notices"></ul>
  <div class="grid">
    <section class="tile goal" id="goal" aria-label="Your goal"></section>
    <article class="tile lead" id="lead" aria-label="What's next"></article>
    <section class="tile queue" id="queue" aria-label="Up next"></section>
    <section class="tile side" id="side" hidden></section>
    <div class="section-head" id="health-head"><h2>Business health</h2><span id="health-src"></span></div>
    <div class="metrics" id="health"></div>
    <div class="section-head" id="growth-head"><h2>Growth</h2><span id="growth-src"></span></div>
    <div class="metrics" id="growth"></div>
    <section class="tile connect" id="connect" aria-label="Business health" hidden></section>
  </div>
  <footer class="strip"><span id="foot"></span><span>Claude 101 by Nexlor</span></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================================================
   1. SETUP — the founder's saved setup. Claude replaces this whole object (see dashboard.md).
      The demo below is an invented business; `demo: true` also runs the self-check.
   ============================================================================================ */
const SETUP = {
  demo: true,
  version: 2,
  founder: "Thandi",
  business: "Demo Uniforms",
  model: "invoices",
  customerWord: "school",
  goal: { title: "15 schools on contract by June", measure: "schools with an active contract", source: "Xero",
          now: 11, target: 15, by: "2027-06-30", unit: "schools", money: false, ratePerMonth: 0.17,
          key: [{ b: "5", t: "quotes open" }, { b: "22%", t: "of quotes win" }, { b: "About 18", t: "more quotes needed" }] },
  // What counts as important for this founder. Labels: win-customers, keep-customers,
  // get-paid, deliver-work, save-time.
  focus: ["win-customers", "keep-customers"],
  heard: [
    "You make school uniforms; schools sign a contract and you invoice them each term.",
    "A great six months is 15 schools on contract by June, up from 11, counted in Xero.",
    "What matters most is keeping your biggest schools ordering.",

    "Your books are in Xero and up to date to October; schools get 30 days to pay."
  ],
  books: { current: true, upTo: "2026-10" },
  terms: 30,
  tools: { connected: ["Xero", "Gmail", "Google Calendar"], next: ["Shopify"], notYet: ["Payfast"] },
  accent: "#8FB3F0",
  accentLight: "#2B4C8C",
  // What the plays and measures found the last time Claude ran them. Shown until live data

  snapshot: {

        ctx: ["Worth R240,000 a year", "The quote expires tomorrow, 24 November", "It would be school 12 of 15"],
        button: "Have Claude draft it", prompt: "Draft an email renewing my quote to Hillside Primary, which expires tomorrow. Show me the draft before anything is sent." },
      { id: "u-top3", play: "demo", helps: ["keep-customers"], urgent: false,

      { id: "u-quotes", play: "demo", helps: ["win-customers"], urgent: false, moves: "Your goal",
        line: "Send four new quotes this month", fact: "At your win rate, 15 schools by June needs about 18 more quotes.",
        ctx: ["2 of 9 quotes won this year", "5 quotes open now", "About 18 more needed for 4 new schools by June"],
        button: "Have Claude find schools to approach", prompt: "Suggest ten schools near my current schools that I have not quoted, and draft a short introduction for the first four. Show me everything before anything is sent." },
      { id: "u-sipho", play: "demo", helps: ["win-customers"], urgent: false, moves: "Your goal",
        line: "Follow up Friday's meeting with Sipho", fact: "No email to him since the meeting.",
        ctx: ["Met on Friday 20 November", "No email to him since"],
        button: "Have Claude draft it", prompt: "Draft a follow-up email to Sipho after our meeting on Friday. Show me the draft before anything is sent." },
      { id: "u-chase", play: "demo", helps: ["get-paid"], urgent: true,
        line: "Chase R148,200 overdue from 3 schools", fact: "All more than 60 days late.",
        button: "Have Claude draft reminders", prompt: "Draft polite payment reminders for the three schools whose invoices are more than 60 days overdue. Show me the drafts before anything is sent." },
      { id: "u-newsletter", play: "demo", helps: ["save-time"], urgent: false,
        line: "Read last month's newsletter stats", fact: "Open rate was 31%." }
    ],
    measures: [
      { id: "cash", group: "health", label: "Cash in the bank", value: "R212,000", tone: "watch", helps: ["get-paid"], period: "October · from Xero",
        note: "Covers 2 months of running costs.", trend: [3.1, 2.8, 2.6, 2.3, 2.0],
        how: "Bank balance today, divided by average monthly running costs over the last 3 months: R212,000 ÷ R104,000. Under 3 months is Watch; under 1 month is Act now." },

/* ============================================================================================
   2. PLAYS — what the dashboard knows how to notice. Claude keeps the plays for the tools this
      founder has connected, removes the rest, and adds plays it wrote and proved during setup
      (see plays.md). Each play reads through `read(server, tool, input)` and returns one item,
      or null when there is nothing to do.
   ============================================================================================ */
const DAY = 864e5;
const gmailDate = (d) => `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
const localTime = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 19);
const clean = (s) => String(s || "").replace(/[\r\n<>]/g, " ").trim().slice(0, 60);
const listNames = (names) => names.length <= 2 ? names.join(" and ") : `${names[0]}, ${names[1]} and ${names.length - 2} more`;
const robot = /no-?reply|notification|mailer|newsletter|donotreply|support@|billing@|info@/i;
// Gmail gives `sender` as an address and the display names in a separate list.
const gmailName = (msg, address) => {
  const hit = (msg.addressDisplayNames || []).find((a) => a.emailAddress === address);
  return clean((hit && hit.displayName) || String(address || "").split("@")[0]);
};
// People on a calendar event who are not the founder and not in the founder's own domain.
const outsiders = (event, ownDomain) => (event.attendees || [])
  .filter((a) => a.email && !a.self && !a.resource && !a.email.endsWith("@" + ownDomain));
const attendeeName = (a) => clean(a.displayName || a.email.split("@")[0]);

const PLAYS = [
  {
    id: "gmail-waiting-on-you",
    what: "People who emailed in the last two weeks and have waited more than two days for a reply.",
    helps: ["keep-customers", "win-customers"],
    tools: [["Gmail", "search_threads"]],
    async find(read, ctx) {
      const r = await read("Gmail", "search_threads",
        { query: "in:inbox category:primary newer_than:14d older_than:2d -from:me", pageSize: 30 });
      const waiting = (r.threads || []).map((t) => (t.messages || []).at(-1))
        .filter((m) => m && !(m.labelIds || []).includes("SENT") && !robot.test(m.sender));
      if (!waiting.length) return null;
      const names = [...new Set(waiting.map((m) => gmailName(m, m.sender)))];
      const oldest = Math.min(...waiting.map((m) => Date.parse(m.date)));
      return {
        line: `Reply to ${listNames(names)}`,
        fact: waiting.length === 1 ? "1 email has waited more than two days" : `${waiting.length} emails have waited more than two days`,
        ctx: [`The oldest has waited ${Math.floor((ctx.now - oldest) / DAY)} days`, `From ${listNames(names)}`],
        urgent: ctx.now - oldest > 4 * DAY,
        button: "Have Claude draft replies",
        prompt: `Find the emails in my inbox from ${listNames(names)} that have waited more than two days for a reply, and draft a reply to each. Show me every draft before anything is sent.`
      };
    }
  },
  {
    id: "gmail-no-reply-to-you",
    what: "Emails the founder sent 4 to 14 days ago that nobody has answered.",
    helps: ["win-customers"],
    tools: [["Gmail", "search_threads"]],
    async find(read) {
      const r = await read("Gmail", "search_threads", { query: "in:sent newer_than:14d older_than:4d", pageSize: 30 });
      const silent = (r.threads || []).map((t) => (t.messages || []).at(-1))
        .filter((m) => m && (m.labelIds || []).includes("SENT") && (m.toRecipients || []).length && !robot.test(m.toRecipients[0]));
      if (!silent.length) return null;
      const names = [...new Set(silent.map((m) => gmailName(m, m.toRecipients[0])))];
      return {
        line: `Follow up with ${listNames(names)}`,
        fact: silent.length === 1 ? "1 email you sent has had no reply in four days" : `${silent.length} emails you sent have had no reply in four days`,
        ctx: [`Sent between 4 and 14 days ago`, `No reply from ${listNames(names)}`],
        urgent: false,
        button: "Have Claude draft follow-ups",
        prompt: `Find the emails I sent to ${listNames(names)} in the last two weeks that have had no reply, and draft a short follow-up to each. Show me every draft before anything is sent.`
      };
    }
  },
  {
    id: "calendar-prepare",
    what: "Meetings in the next two days with people outside the business.",
    helps: ["win-customers", "keep-customers", "deliver-work"],
    tools: [["Google Calendar", "list_events"]],
    async find(read, ctx) {
      const r = await read("Google Calendar", "list_events", {
        startTime: localTime(ctx.now), endTime: localTime(new Date(ctx.now.getTime() + 2 * DAY)), orderBy: "startTime", pageSize: 25 });
      const own = String(r.summary || "").split("@")[1] || "";
      const meetings = (r.events || []).filter((e) => e.status !== "cancelled" && e.start && e.start.dateTime && outsiders(e, own).length);
      if (!meetings.length) return null;
      const first = meetings[0], start = new Date(first.start.dateTime);
      const when = start.toLocaleString(undefined, { weekday: "long", hour: "numeric", minute: "2-digit" });
      const who = listNames(outsiders(first, own).map(attendeeName));
      return {
        line: `Prepare for ${clean(first.summary) || "your meeting"}`,
        fact: `${when}, with ${who}.`,
        ctx: [when, `With ${who}`].concat(meetings.length > 1 ? [`${meetings.length - 1} more outside meeting${meetings.length > 2 ? "s" : ""} in the next two days`] : []),
        urgent: start - ctx.now < DAY,
        button: "Have Claude prepare a brief",
        prompt: `I have a meeting, "${clean(first.summary)}", on ${when} with ${who}. From my email and calendar, prepare a one-page brief: who they are, what we last discussed, and what I should ask for.`
      };
    }
  },
  {
    id: "calendar-follow-up",
    what: "Meetings in the past week with someone outside the business, with no email to them since.",
    helps: ["win-customers", "keep-customers"],
    tools: [["Google Calendar", "list_events"], ["Gmail", "search_threads"]],
    async find(read, ctx) {
      const r = await read("Google Calendar", "list_events", {
        startTime: localTime(new Date(ctx.now.getTime() - 7 * DAY)), endTime: localTime(ctx.now), orderBy: "startTimeDesc", pageSize: 25 });
      const own = String(r.summary || "").split("@")[1] || "";
      const held = (r.events || []).filter((e) => e.status !== "cancelled" && e.end && e.end.dateTime && outsiders(e, own).length).slice(0, 5);
      const open = [];
      for (const e of held) {
        const guest = outsiders(e, own)[0];
        // Gmail's `after:` counts from midnight, so an email sent earlier on the meeting day counts as a follow-up.
        const sent = await read("Gmail", "search_threads", { query: `in:sent to:${guest.email} after:${gmailDate(new Date(e.end.dateTime))}`, pageSize: 1 });
        if (!(sent.threads || []).length) open.push({ e, guest });
      }
      if (!open.length) return null;
      const { e, guest } = open[0];
      const day = new Date(e.end.dateTime).toLocaleString(undefined, { weekday: "long" });
      return {
        line: `Follow up ${day}'s meeting with ${attendeeName(guest)}`,
        fact: `No email to them since "${clean(e.summary)}".`,
        ctx: [`Met on ${day}`, "No email to them since"].concat(open.length > 1 ? [`${open.length - 1} more meeting${open.length > 2 ? "s" : ""} like this`] : []),
        urgent: false,
        button: "Have Claude draft it",
        prompt: `Draft a follow-up email to ${attendeeName(guest)} after our meeting "${clean(e.summary)}" on ${day}. Use what you can find in my email for context. Show me the draft before anything is sent.`
      };
    }
  }
];

/* ============================================================================================
   3. MEASURES — the numbers under Business health and Growth, and the goal's progress. Claude
      writes and proves these during setup from the founder's own accounting and shop data
      (see measures.md). Each reads through `read(server, tool, input)` and returns one number,
      or null when the data is not there. A measure with group "goal" updates the goal instead.
   ============================================================================================ */
const MEASURES = [];

/* ============================================================================================
   4. THE PAGE — do not change below this line when filling in a founder's dashboard.
   ============================================================================================ */
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const MOVES = { "win-customers": "Winning customers", "keep-customers": "Keeping customers", "get-paid": "Cash", "deliver-work": "Delivering work", "save-time": "Your time" };
const WORDS = { good: "Healthy", watch: "Watch", act: "Act now" };

// ponytail: "done", "not for me" and the theme are remembered per browser (localStorage).
// Move them to the artifact `db` capability once founders use more than one device.
const store = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
};
const MEMORY_KEY = "whats-next-memory-v1", THEME_KEY = "whats-next-theme";
const memory = {
  read() { return store.get(MEMORY_KEY, {}); },
  mark(id, kind) { const m = this.read(); m[id] = { kind, at: Date.now() }; store.set(MEMORY_KEY, m); }
};

// The Eisenhower rule. Important = the item helps something in the founder's focus.
// Urgent and important first, then important. Urgent but not important is offered to Claude.
// Neither is never shown. Done items stay away for a week; "not for me" items stay away.
function choose(items, focus, mem, now) {
  const open = items.filter((i) => {
    const m = mem[i.id];
    return !m || (m.kind === "done" && now - m.at >= 7 * DAY);
  }).map((i) => ({ ...i, important: (i.helps || []).some((h) => focus.includes(h)), again: !!mem[i.id] }));
  return {
    next: open.filter((i) => i.important).sort((a, b) => (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0)).slice(0, 3),
    hand: open.filter((i) => !i.important && i.urgent).slice(0, 2)
  };
}

const money = (n, cur) => (n < 0 ? "−" : "") + (cur || "R") + Math.round(Math.abs(n)).toLocaleString("en-GB");
const goalNumber = (g, n) => g.money ? money(n, g.currency) : Math.round(n).toLocaleString("en-GB");
const monthName = (d, today) => d.toLocaleDateString(undefined, d.getFullYear() === today.getFullYear() || d - today < 300 * DAY ? { month: "long" } : { month: "long", year: "numeric" });

// The goal's progress, pace and status, worked out from where it stands, the target, the date
// and how fast it has moved lately (ratePerMonth, from the goal measure or the setup).
function goalView(g, today) {
  if (!g || !g.title) return null;
  const tracked = g.now != null && g.target != null && g.by;
  const view = { title: g.title, tracked, key: g.key || [] };
  if (!tracked) { view.pace = g.source ? `Tracked for you once ${g.source} is connected.` : "Ask Claude how this goal can be counted."; return view; }
  const end = new Date(g.by), months = Math.max(0.25, (end - today) / (30.44 * DAY)), left = g.target - g.now;
  view.now = goalNumber(g, g.now);
  view.of = "of " + goalNumber(g, g.target) + (g.unit ? " " + g.unit : "");
  view.fill = Math.max(2, Math.min(100, Math.round(g.now / g.target * 100))) + "%";
  view.short = goalNumber(g, g.target) + (g.unit ? " " + g.unit : "");
  if (left <= 0) { view.tone = "good"; view.status = "Reached"; view.pace = "You have reached your goal. Ask Claude to set the next one."; return view; }
  const needed = left / months, when = monthName(end, today);
  if (g.money) view.pace = `You need to grow by about ${money(needed, g.currency)} a month to reach it by ${when}.`;
  else {
    const weeks = months * 4.345 / left;
    view.pace = weeks >= 1.5 ? `You need ${goalNumber(g, left)} more by ${when}: about one every ${Math.round(weeks)} weeks.`
                             : `You need ${goalNumber(g, left)} more by ${when}: about ${Math.round(left / (months * 4.345))} a week.`;
  }
  if (g.ratePerMonth != null) {
    const onPace = g.ratePerMonth >= needed * 0.95;
    view.tone = onPace ? "good" : "watch";
    view.status = onPace ? "On pace" : "Behind pace";
    const reach = g.now + g.ratePerMonth * months;
    if (!onPace) view.pace += ` At your current pace you will reach ${goalNumber(g, g.money ? reach : Math.floor(reach))} by ${when}.`;
  }
  return view;
}

// The tile beside the queue: a number at Act now, with the work Claude can do about it, or
// else the first thing Claude can take off the founder's hands.
function sideView(measures, hand, mem, now) {
  const fresh = (id) => { const m = mem[id]; return !m || (m.kind === "done" && now - m.at >= 7 * DAY); };
  const act = measures.find((m) => m.tone === "act" && fresh("act-" + m.id));
  if (act) {
    const fix = hand.find((h) => (h.helps || []).some((x) => (act.helps || []).includes(x)));
    return { kind: "act", label: "Act now", when: act.label, title: act.alert || `${act.label}: ${act.value}`,
      body: fix ? `${fix.line}. ${fix.fact}` : act.note,
      item: fix || { id: "act-" + act.id, button: "Ask Claude what to do",
        prompt: `My ${act.label.toLowerCase()} is ${act.value}. ${act.note} Using my connected tools, what should I do about it first?` } };
  }
  if (hand[0]) return { kind: "hand", label: "Claude can take this off your hands", when: "", title: hand[0].line, body: hand[0].fact, item: hand[0] };
  return null;
}

function selfCheck() {
  const s = SETUP.snapshot, focus = ["win-customers", "keep-customers"], fails = [];
  const ok = (cond, what) => { if (!cond) fails.push(what); };
  let r = choose(s.items, focus, {}, 0);
  ok(r.next.length === 3 && r.next[0].id === "u-hillside", "urgent and important leads");
  ok(r.hand.length === 1 && r.hand[0].id === "u-chase", "urgent but not important is offered to Claude");
  ok(![...r.next, ...r.hand].some((i) => i.id === "u-newsletter"), "neither urgent nor important is never shown");
  r = choose(s.items, focus, { "u-hillside": { kind: "done", at: 0 } }, DAY);
  ok(r.next.length === 3 && r.next[2].id === "u-sipho", "a done item leaves and the next moves up");
  r = choose(s.items, focus, { "u-hillside": { kind: "done", at: 0 } }, 8 * DAY);
  ok(r.next[0].id === "u-hillside" && r.next[0].again, "a done item returns after a week");
  r = choose(s.items, focus, { "u-hillside": { kind: "skip", at: 0 }, "u-sipho": { kind: "skip", at: 0 } }, 999 * DAY);
  ok(r.next.length === 2, "a not-for-me item stays away and the list is not padded");
  const side = sideView(s.measures, choose(s.items, focus, {}, 0).hand, {}, 0);
  ok(side && side.kind === "act" && side.item.id === "u-chase", "a number at Act now carries the work that fixes it");
  ok(!sideView(s.measures.filter((m) => m.tone !== "act"), [], {}, 0), "no act number and nothing to hand off: no side tile");
  const g = goalView(SETUP.goal, new Date("2026-11-23T07:00:00+02:00"));
  ok(g.status === "Behind pace" && /every 8 weeks/.test(g.pace) && /reach 12 by/.test(g.pace), "goal pace: " + g.pace);
  ok(goalView({ title: "x", now: 98400, target: 150000, by: "2027-03-31", money: true, unit: "a month" }, new Date("2026-11-23")).short === "R150,000 a month", "money goal reads in rand");
  ok(!goalView({ title: "x", source: "Xero" }, new Date()).tracked, "a goal with no number is shown without a bar");
  console.log("whats-next self-check:", fails.length ? fails : "ok");
}

let toastTimer;
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 3200); }

// Handing a job to Claude: copy a ready-made request for the founder to paste into Claude.
// ponytail: copy-and-paste always works. Replace with a direct hand-off if testing finds one.
async function handToClaude(prompt, line) {
  try { await navigator.clipboard.writeText(prompt); toast("Copied. Paste it into Claude."); }
  catch { toast("Couldn't copy. Ask Claude: " + line); }
}

function actionButton(item, cls) {
  if (item.link) { const a = el("a", cls, item.button || "Open it"); a.href = item.link; a.target = "_blank"; a.rel = "noopener"; return a; }
  const b = el("button", cls, item.button || "Have Claude do it"); b.type = "button";
  b.onclick = () => handToClaude(item.prompt || item.line, item.line);
  return b;
}
function quietButton(text, onclick) { const b = el("button", "btn quiet", text); b.type = "button"; b.onclick = onclick; return b; }

const state = { items: SETUP.snapshot.items || [], measures: SETUP.snapshot.measures || [], goal: SETUP.goal || {},
  live: null, problems: [], pick: null, flip: false, rerun: null, open: {} };

function render() {
  const now = Date.now(), mem = memory.read();
  const { next, hand } = choose(state.items, SETUP.focus || [], mem, now);
  const goal = goalView(state.goal, new Date());

  const hour = new Date().getHours();
  $("headline").replaceChildren();
  if (next.length) {
    $("headline").append(el("span", "n", next.length),
      `${next.length === 1 ? "thing moves" : "things move"} you toward ${goal && goal.tracked ? goal.short : "your goal"}`);
  } else $("headline").textContent = "Nothing needs you right now";
  $("hello").textContent = `Good ${hour < 12 ? "morning" : hour < 18 ? "afternoon" : "evening"}${SETUP.founder ? ", " + SETUP.founder : ""}. ${SETUP.snapshot.summary || ""}`.trim();

  // Goal
  const gt = $("goal"); gt.replaceChildren(); gt.hidden = !goal;
  if (goal) {
    const head = el("div"); head.append(Object.assign(el("p", "label"), { style: "margin-bottom:4px" }), el("h2", "", goal.title));
    head.firstChild.append(el("span", "", "Your goal"));
    gt.append(head);
    if (goal.tracked) {
      const count = el("div", "count"), num = el("span");
      num.append(el("span", "big", goal.now), el("span", "of", goal.of));
      count.append(num);
      if (goal.status) count.append(el("span", "tone " + goal.tone, goal.status));
      const bar = el("div", "bar"); bar.setAttribute("aria-hidden", "true"); const fill = el("i"); fill.style.width = goal.fill; bar.append(fill);
      gt.append(count, bar, el("p", "pace", goal.pace));
      if (goal.key.length) { const key = el("div", "key"); goal.key.forEach((k) => { const s = el("span"); s.append(el("b", "", k.b), " " + k.t); key.append(s); }); gt.append(key); }
    } else {
      const count = el("div", "count"); count.append(Object.assign(el("span", "", goal.pace), { style: "color:var(--dim)" })); gt.append(count);
    }
  }

  // Lead and queue
  const lead = $("lead"), queue = $("queue");
  lead.replaceChildren(); queue.replaceChildren();
  const current = next.find((i) => i.id === state.pick) || next[0];
  if (current) {
    const n = next.indexOf(current) + 1;
    const body = el("div", "lead-body"); body.style.animationName = state.flip ? "in-a" : "in-b";
    const who = el("p", "who"); who.append(el("span", "", `${n} of ${next.length}`),
      el("span", "tag", "Moves: " + (current.moves || MOVES[(current.helps || [])[0]] || "Your goal")));
    body.append(who, el("h2", "", current.line), el("p", "said", (current.again ? "Still open. " : "") + (current.fact || "")));
    if (current.ctx && current.ctx.length) {
      const box = el("div"), list = el("ul", "ctx");
      current.ctx.forEach((c) => list.append(el("li", "", c)));
      box.append(el("p", "label", "The numbers behind it"), list); body.append(box);
    }
    const acts = el("footer", "acts");
    acts.append(actionButton(current, "btn"),
      quietButton("Done", () => { memory.mark(current.id, "done"); state.pick = null; state.flip = !state.flip; render(); }),
      quietButton("Not for me", () => { memory.mark(current.id, "skip"); state.pick = null; state.flip = !state.flip; render(); }),
      el("span", "pos", "Claude shows you everything before it is sent"));
    body.append(acts); lead.append(body);
    const label = el("p", "label"); label.append(el("span", "", "What's next"), el("span", "", `${next.length} of 3`));
    const list = el("ul");
    next.forEach((item, i) => {
      const b = el("button", "qi"); b.type = "button"; b.setAttribute("aria-current", item === current ? "true" : "false");
      const text = el("span"); text.style.minWidth = "0"; text.append(el("span", "t", item.line), el("span", "f", item.fact || ""));
      b.append(el("span", "num", i + 1), text);
      b.onclick = () => { if (state.pick !== item.id) { state.pick = item.id; state.flip = !state.flip; render(); } };
      const li = el("li"); li.append(b); list.append(li);
    });
    queue.append(label, list);
  } else {
    const zero = el("div", "zero"); zero.append(el("h2", "", "All clear"), el("p", "", "New things appear here as your tools change."));
    lead.append(zero);
  }
  queue.hidden = !current;

  // Side tile
  const side = sideView(state.measures, hand, mem, now), st = $("side");
  st.replaceChildren(); st.hidden = !side;
  if (side) {
    st.className = "tile side " + side.kind; st.setAttribute("aria-label", side.label);
    const label = el("p", "label"); label.append(el("span", "", side.label), el("span", "", side.when));
    const acts = el("div", "acts");
    acts.append(actionButton(side.item, "btn sm"),
      Object.assign(quietButton("Done", () => { memory.mark(side.item.id, "done"); render(); }), { className: "btn quiet sm" }));
    st.append(label, el("h3", "", side.title), el("p", "", side.body), acts);
  }

  // Business health and growth
  for (const group of ["health", "growth"]) {
    const list = state.measures.filter((m) => m.group === group), box = $(group);
    box.replaceChildren(); box.hidden = $(group + "-head").hidden = !list.length;
    $(group + "-src").textContent = (list.find((m) => m.period) || {}).period || "";
    list.forEach((m) => {
      const tile = el("div", "tile metric"), label = el("p", "label");
      label.append(el("span", "", m.label), el("span", "tone " + m.tone, WORDS[m.tone] || ""));
      const row = el("div", "row"); row.append(el("span", "big", m.value));
      if (m.trend && m.trend.length > 1) row.append(spark(m.trend, m.tone));
      const open = !!state.open[m.id], link = el("button", "quietlink", open ? "Hide how it's worked out" : "How it's worked out");
      link.type = "button"; link.setAttribute("aria-expanded", String(open));
      link.onclick = () => { state.open[m.id] = !open; render(); };
      tile.append(label, row, el("p", "note", m.note || ""), link);
      if (open) tile.append(el("p", "how", m.how || ""));
      box.append(tile);
    });
  }
  const noNumbers = !state.measures.some((m) => m.group === "health" || m.group === "growth");
  const connect = $("connect"); connect.replaceChildren(); connect.hidden = !noNumbers;
  if (noNumbers) {
    const tool = ((SETUP.tools || {}).next || [])[0] || "your accounting";
    const b = el("button", "btn", "Connect " + tool); b.type = "button";
    b.onclick = () => handToClaude(`Add ${tool} to my What's next dashboard.`, "Add " + tool);
    connect.append(Object.assign(el("p", "label", "Business health"), { style: "margin-bottom:0" }), el("h3", "", "See how the business is really doing"),
      el("p", "", `Connect ${tool} and this page shows your cash, your profit on each sale, and the numbers that move your goal.`), b);
  }

  // Status, problems, footer
  const status = $("status");
  status.lastChild.textContent = state.live || snapshotLabel();
  status.classList.toggle("old", !state.live || /^Partly/.test(state.live));
  const notices = $("notices"); notices.replaceChildren();
  state.problems.forEach((text) => notices.append(el("li", "", text)));
  if (state.problems.length && state.rerun) notices.lastChild.append(Object.assign(quietButton("Try again", state.rerun), { className: "btn quiet sm" }));
  const tools = SETUP.tools || {};
  $("foot").textContent = (tools.connected && tools.connected.length ? `Reads ${listNames(tools.connected)}. ` : "") + "Nothing is changed or sent without you."
    + (tools.next && tools.next.length ? ` Connect ${tools.next[0]} to see more: ask Claude to add it.` : "");
}

function spark(vals, tone) {
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg"), line = document.createElementNS(ns, "polyline");
  const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
  svg.setAttribute("viewBox", "0 0 64 24"); svg.setAttribute("width", "64"); svg.setAttribute("height", "24");
  svg.setAttribute("aria-hidden", "true"); svg.setAttribute("class", "spark " + tone);
  line.setAttribute("points", vals.map((v, i) => `${(2 + i * 60 / (vals.length - 1)).toFixed(1)},${(21 - (v - lo) / span * 18).toFixed(1)}`).join(" "));
  line.setAttribute("fill", "none"); line.setAttribute("stroke-width", "1.75"); line.setAttribute("stroke-linecap", "round"); line.setAttribute("stroke-linejoin", "round");
  svg.append(line); return svg;
}

const at = (d) => d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
function snapshotLabel() {
  const d = new Date(SETUP.snapshot.takenAt);
  return isNaN(d) ? "Snapshot" : `Snapshot · ${d.toLocaleDateString(undefined, { day: "numeric", month: "short" })}, ${at(d)}`;
}

// What to tell the founder when a tool cannot be read. One line per tool, by cause.
function explain(server, code) {
  if (code === "needs_reauth") return `Reconnect ${server} in Claude: Settings → Connectors.`;
  if (["server_not_connected", "server_not_found", "selection_required"].includes(code)) return `Add ${server} in Claude: Settings → Connectors.`;
  if (["not_in_manifest", "approval_required", "consent_required", "blocked_by_policy", "not_granted"].includes(code)) return `${server} is not allowed for this page yet.`;
  return `${server} did not answer just now. Showing the last snapshot for it.`;
}
const transient = (code) => ["server_unavailable", "upstream_error", "rate_limited", "cancelled"].includes(code);

async function goLive(mcp) {
  state.live = "Checking your tools…"; state.problems = []; render();
  const failed = new Map();            // server -> error code
  const read = async (server, tool, input) => {
    try { return (await mcp.callTool(server, tool, input || {}, { cache: { staleTime: 5 * 60e3, gcTime: 60 * 60e3 } })).payload || {}; }
    catch (e) { failed.set((e && e.server) || server, (e && e.code) || "upstream_error"); throw e; }
  };
  const ctx = { now: new Date(), setup: SETUP };
  const keepOld = (tools) => { const codes = tools.map(([s]) => failed.get(s)).filter(Boolean); return codes.length && codes.every(transient); };
  const items = [], measures = [];
  let goal = SETUP.goal || {};
  // One at a time, so a founder sees one approval question at a time.
  for (const play of PLAYS) {
    try {
      const found = await play.find(read, ctx);
      [].concat(found || []).forEach((it) => items.push({ helps: play.helps, play: play.id, ...it, id: it.id || play.id }));
    } catch (e) { if (keepOld(play.tools)) items.push(...SETUP.snapshot.items.filter((s) => s.play === play.id)); }
  }
  for (const m of MEASURES) {
    try {
      const found = await m.find(read, ctx);
      if (!found) continue;
      if (m.group === "goal") goal = { ...goal, ...found };
      else measures.push({ id: m.id, group: m.group, label: m.label, helps: m.helps, ...found });
    } catch (e) { if (keepOld(m.tools)) measures.push(...(SETUP.snapshot.measures || []).filter((s) => s.id === m.id)); }
  }
  const servers = new Set([...PLAYS, ...MEASURES].flatMap((p) => p.tools.map((t) => t[0])));
  state.items = items.length || !failed.size ? items : SETUP.snapshot.items;
  state.measures = measures.length || !failed.size ? measures : (SETUP.snapshot.measures || []);
  state.goal = goal;
  state.problems = [...failed].map(([server, code]) => explain(server, code));
  state.live = failed.size === 0 ? `Live ${at(new Date())}` : failed.size < servers.size ? `Partly live ${at(new Date())}` : null;
  render();
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll("#theme button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.theme === theme)));
}

function start() {
  const hex = /^#[0-9a-f]{6}$/i;
  if (hex.test(SETUP.accent || "")) document.documentElement.style.setProperty("--accent-dark", SETUP.accent);
  if (hex.test(SETUP.accentLight || "")) document.documentElement.style.setProperty("--accent-light", SETUP.accentLight);
  applyTheme(store.get(THEME_KEY, "auto"));
  document.querySelectorAll("#theme button").forEach((b) => b.onclick = () => { store.set(THEME_KEY, b.dataset.theme); applyTheme(b.dataset.theme); });
  $("biz").textContent = SETUP.business || "";
  $("date").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  render();
  if (SETUP.demo) selfCheck();
  if (!window.claude || !(PLAYS.length + MEASURES.length) || SETUP.demo) return;
  window.claude.use("mcp").then((mcp) => {
    if (!mcp) { state.problems = ["Live data isn't available here. Ask Claude to refresh your What's next dashboard."]; render(); return; }
    state.rerun = () => goLive(mcp);
    goLive(mcp);
  }).catch(() => {});
}
start();
</script>
